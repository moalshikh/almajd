<style>
:root{--brand:#2B2A6E;--deep:#0C0B26;--accent:#7C6BF0;--gold:#E8C25A;--gold2:#B98C2E;
  --ok:#2FBF71;--no:#E5484D;--yel:#FDD835;
  --line:rgba(255,255,255,.14);--muted:rgba(255,255,255,.62);--ui:'Tajawal','Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--deep);color:#fff;font-family:var(--ui);min-height:100vh}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.btn{padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.1);transition:background .15s}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.primary{background:var(--accent);color:#fff}
.btn.gold{background:linear-gradient(160deg,var(--gold),var(--gold2));color:#2B1D00}
.btn.ok{background:var(--ok);color:#042F18}.btn.no{background:var(--no);color:#fff}
.btn.danger{background:rgba(255,120,120,.2)}
.btn.sm{padding:6px 11px;font-size:12px}.btn.lg{padding:13px 20px;font-size:15px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.tip{font-size:12.5px;color:var(--muted);line-height:1.8}.tip b{color:var(--accent)}
input.in,select.in,textarea.in{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.7}
input.in:focus,textarea.in:focus{border-color:var(--accent);outline:none}
input[type=time],input[type=date],input[type=number]{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9000;background:var(--brand);
  border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-weight:700;font-size:13.5px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:90vw}

/* ================= CONTROL ================= */
.ctrl{display:grid;grid-template-columns:225px 1fr;min-height:100vh}
@media(max-width:860px){.ctrl{grid-template-columns:1fr}}
#rmOv{display:none}
#rmOv.rmPair{display:flex;position:fixed;inset:0;z-index:9000;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a2770,var(--deep) 70%)}
.rmBox{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2.2vh}
.rmLogo{height:12vh;background:#fff;border-radius:1.6vh;padding:1.4vh 1.8vw}
.rmT{font-weight:800;font-size:5.4vh;color:var(--gold)}.rmS{font-size:2.8vh;color:#d9d6ff;max-width:70vw;line-height:1.6}
.rmCode{display:flex;gap:1.2vw;direction:ltr}.rmCode span{font-weight:800;font-size:10vh;width:8.4vw;height:14vh;display:grid;place-items:center;background:#fff;color:#1d1a52;border-radius:1.6vh;box-shadow:0 1vh 3vh rgba(0,0,0,.35)}
.rmQR{display:flex;align-items:center;gap:1.6vw;color:var(--muted);font-size:2.2vh}.rmQR svg{width:20vh;height:20vh;background:#fff;border-radius:1vh}
.rmBtn{font:inherit;font-weight:800;font-size:2.6vh;padding:1.4vh 2.6vw;border-radius:99px;border:2px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
.rmNet{font-size:2vh;color:var(--muted);display:flex;align-items:center;gap:.5vw}.rmNet i{width:1.2vh;height:1.2vh;border-radius:50%;background:#555;display:inline-block}.rmNet i.on{background:var(--ok)}
#rmOv.rmLost{display:flex;position:fixed;left:1.5vw;bottom:2vh;z-index:9000;gap:.8vw;align-items:center;background:rgba(0,0,0,.6);color:#ffd2c8;font-size:1.8vh;font-weight:700;padding:.9vh 1.4vw;border-radius:99px}
#rmOv.rmLost .dot{width:1.2vh;height:1.2vh;border-radius:50%;background:#E5484D;animation:rmB 1s infinite alternate}@keyframes rmB{to{opacity:.3}}
.side{background:#141236;border-left:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.side .brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.side .brand span{background:#fff;border-radius:8px;padding:5px 7px}
.side .brand img{height:26px;display:block}
.side .brand b{font-size:14px;line-height:1.3}
.nav{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:700;text-align:right;width:100%}
.nav:hover{background:rgba(255,255,255,.06)}.nav.on{background:var(--brand)}
.nav i{font-style:normal;width:20px;text-align:center}
.scrState{margin-top:auto;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:12px;line-height:1.7}
.scrState .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#777;margin-left:6px;vertical-align:middle}
.scrState .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.main{padding:18px 20px 60px;max-width:1150px}
.main h2{margin:0 0 4px;font-size:20px}.main .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.card{background:var(--brand);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.nowShow{display:flex;align-items:center;gap:10px;background:rgba(124,107,240,.14);border:1px solid rgba(124,107,240,.45);
  border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.nowShow b{color:var(--accent)}
.clsTag{display:inline-block;background:rgba(255,255,255,.16);border-radius:99px;padding:.15em .7em;margin-right:.5em;font-weight:800;font-size:.62em;vertical-align:middle;opacity:.9}
.gTag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(232,194,90,.2);color:var(--gold)}
.tRow{display:grid;grid-template-columns:auto 1fr 84px 70px auto;gap:8px;align-items:center;background:rgba(0,0,0,.22);border-radius:10px;padding:8px;margin-bottom:5px}
.tRow input{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13.5px;width:100%}
.tRow input.nm{background:transparent;border-color:transparent;font-size:14.5px;font-weight:700}
.tRow input.nm:focus{border-color:var(--accent);background:rgba(0,0,0,.3);outline:none}
.tRow input[type=color]{width:32px;height:32px;border:none;background:none;padding:0}
.tRow .tools{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.qRow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:rgba(0,0,0,.2);
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:5px;font-size:13.5px}
.qRow .cat{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.cat.d{background:rgba(47,191,113,.2);color:#6BE0A4}
.cat.v{background:rgba(124,107,240,.22);color:#B4A8FF}
.cat.r{background:rgba(232,194,90,.2);color:var(--gold)}
.cat.bi{background:rgba(47,191,113,.2);color:#7BEA9C}.cat.ma{background:rgba(30,136,229,.22);color:#8EC8FF}
.cat.tc{background:rgba(0,172,193,.22);color:#7FE3F0}.cat.ch{background:rgba(229,72,77,.22);color:#FF9DA0}
.cat.ph{background:rgba(251,140,0,.22);color:#FFC37A}.cat.ea{background:rgba(124,179,66,.22);color:#C5E89A}
.qRow.used{opacity:.45}
.optBtn{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:rgba(0,0,0,.25);
  border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;margin-bottom:8px}
.optBtn:hover{border-color:var(--accent)}
.optBtn .k{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
.optBtn.right{border-color:var(--ok);background:rgba(47,191,113,.14)}
.optBtn.right .k{background:var(--ok);color:#042F18}
.playTop{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:rgba(0,0,0,.25);
  border-radius:14px;padding:12px 16px;margin-bottom:14px}
.playTop .tn{font-weight:800;font-size:18px}
.playTop .ck{font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;color:var(--accent)}
.veil{position:fixed;inset:0;z-index:5000;background:rgba(6,6,26,.86);display:none;align-items:center;justify-content:center;padding:16px}
.veil.on{display:flex}
.modal{background:var(--brand);border:1px solid var(--line);border-radius:18px;width:100%;max-width:620px;padding:20px;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 12px}

/* ================= SCREEN ================= */
.stage{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;overflow:hidden;
  background:radial-gradient(85% 60% at 50% 115%,rgba(124,107,240,.26),transparent 62%),
             radial-gradient(60% 50% at 50% -12%,rgba(232,194,90,.13),transparent 60%),var(--deep)}
.stage.on{display:flex}
body.screenMode{cursor:none;overflow:hidden}
body.screenMode .stage{display:flex}
.beams{position:absolute;inset:-35%;pointer-events:none;opacity:.5;
  background:conic-gradient(from 0deg at 50% 60%,transparent 0 8deg,rgba(255,255,255,.05) 8deg 12deg,transparent 12deg 30deg,
  rgba(124,107,240,.08) 30deg 34deg,transparent 34deg 60deg);animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sHead{position:relative;z-index:3;display:flex;align-items:center;gap:2vw;padding:1.5vh 3vw;background:#fff;color:var(--brand);flex:0 0 auto}
.sHead img{height:6.4vh;max-height:68px}
.sHead h1{margin:0;font-size:clamp(17px,4vh,48px);font-weight:800}
.sHead .ph{margin-right:auto;color:var(--accent);font-weight:800;font-size:clamp(12px,2.3vh,27px)}
.sBody{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;padding:2.2vh 3vw}
.fsHint{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2vh;background:var(--deep);cursor:pointer;text-align:center}
.fsHint.on{display:flex}
.fsHint b{font-size:clamp(18px,4vh,48px)}.fsHint span{color:var(--muted);font-size:clamp(12px,2.2vh,26px)}
.miniCtl{position:fixed;left:1vw;bottom:1.4vh;z-index:900;display:flex;gap:6px;opacity:.15;transition:opacity .2s}
.miniCtl:hover{opacity:1}
body.screenMode .miniCtl{display:none}
.shd{display:inline-block;flex:0 0 auto;vertical-align:middle;filter:drop-shadow(0 .5vh 1.2vh rgba(0,0,0,.45))}

/* idle / teams */
.idle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center}
.idle .ti{font-size:clamp(28px,10vh,150px);font-weight:800;line-height:1.05;
  background:linear-gradient(160deg,#fff 30%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.idle .st{color:var(--accent);font-weight:800;font-size:clamp(14px,3vh,38px)}
.teamWall{display:grid;gap:1.6vh 1.4vw;flex:1;align-content:center;grid-template-columns:repeat(var(--c,5),1fr)}
.teamWall .tw{display:flex;flex-direction:column;align-items:center;gap:1vh;font-weight:800;font-size:clamp(11px,2.1vh,25px);text-align:center}

/* draw */
.drawGrid{flex:1;min-height:0;display:grid;gap:3vw;grid-template-columns:repeat(var(--g,2),1fr)}
.grp{display:flex;flex-direction:column;min-height:0}
.grp h2{margin:0 0 1.2vh;text-align:center;font-size:clamp(18px,4.6vh,58px);font-weight:800;
  background:linear-gradient(160deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.slots{flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--n,10),1fr);gap:.7vh}
.slot{display:flex;align-items:center;gap:1vw;border-radius:clamp(8px,1.3vh,15px);padding:0 1.2vw;min-height:0;overflow:hidden;
  background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.18);font-weight:800;font-size:clamp(11px,2.4vh,30px)}
.slot .no{color:var(--muted);font-size:.8em;min-width:1.6em}
.slot.filled{border-style:solid}
.slot.flash{animation:slotIn .9s cubic-bezier(.2,1.4,.3,1)}
@keyframes slotIn{0%{transform:scale(1.2);filter:brightness(2)}100%{transform:scale(1)}}

/* overlay fx */
.ov{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2.4vh;
  background:radial-gradient(60% 60% at 50% 45%,rgba(28,24,80,.95),rgba(8,8,28,.995));text-align:center}
.ov.on{display:flex}
.ov .lbl{color:var(--accent);font-weight:800;font-size:clamp(14px,3vh,38px);letter-spacing:.05em}
.ov .nm{font-weight:800;font-size:clamp(32px,12vh,175px);line-height:1;padding:0 4vw}
.ov .to{font-weight:800;font-size:clamp(16px,4vh,52px);color:var(--gold)}
.ov .rays{position:absolute;inset:-45%;z-index:-1;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 6deg,rgba(255,255,255,.1) 6deg 12deg,transparent 12deg 24deg);animation:spin 9s linear infinite}
.slam{animation:slam .8s cubic-bezier(.2,1.5,.35,1)}
@keyframes slam{0%{transform:scale(2.6);opacity:0;filter:blur(10px)}55%{opacity:1;filter:blur(0)}75%{transform:scale(.94)}100%{transform:scale(1)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-6px,3px)}80%{transform:translate(4px,-2px)}}
.roul{display:flex;gap:2vw;align-items:center;justify-content:center;flex-wrap:wrap;max-width:92vw}
.roul .rc{display:flex;flex-direction:column;align-items:center;gap:1vh;opacity:.28;transform:scale(.86);transition:opacity .08s,transform .08s;font-weight:800;font-size:clamp(11px,2vh,24px)}
.roul .rc.hot{opacity:1;transform:scale(1.12)}
.roul .rc.win{opacity:1;transform:scale(1.25)}

/* ===== QUESTION ===== */
.qS{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.8vh}
.qTop{display:flex;align-items:center;gap:1.4vw;flex:0 0 auto}
.qTop .tn2{display:flex;align-items:center;gap:1vw;font-weight:800;font-size:clamp(14px,3.2vh,40px)}
.qTop .cat2{font-weight:800;font-size:clamp(11px,2.1vh,25px);padding:.6vh 1.6vw;border-radius:99px}
.qTop .idx{margin-right:auto;color:var(--muted);font-weight:800;font-size:clamp(11px,2.1vh,25px)}
.qBody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:3vw}
.qText{flex:1;font-weight:800;line-height:1.45;text-align:center;
  font-size:clamp(20px,6.2vh,86px);text-shadow:0 1.2vh 4vh rgba(0,0,0,.45)}
.qText.long{font-size:clamp(17px,4.8vh,66px)}
.ring{flex:0 0 auto;position:relative;width:26vh;height:26vh;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg2{fill:none;stroke:rgba(255,255,255,.12);stroke-width:7}
.ring .fg2{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.ring.warn .fg2{stroke:var(--yel)}.ring.hot .fg2{stroke:var(--no)}
.ring b{position:relative;z-index:1;font-weight:800;font-size:9vh;font-variant-numeric:tabular-nums}
.ring.hot b{color:var(--no);animation:pulse2 .6s infinite}
@keyframes pulse2{50%{transform:scale(1.1)}}
.qOpts{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 1.6vw}
.qOpt{display:flex;align-items:center;gap:1.2vw;background:rgba(255,255,255,.07);border:.25vh solid rgba(255,255,255,.16);
  border-radius:1.8vh;padding:1.5vh 1.8vw;font-weight:800;font-size:clamp(14px,3.1vh,40px);
  transition:background .4s,border-color .4s,transform .4s,opacity .4s}
.qOpt .kk{width:5vh;height:5vh;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;
  font-size:.75em;flex:0 0 auto}
.qOpt .tt{flex:1;min-width:0}
.qOpt.pick{border-color:var(--accent);background:rgba(124,107,240,.26);transform:scale(1.03)}
.qOpt.right{border-color:var(--ok);background:rgba(47,191,113,.28);transform:scale(1.04)}
.qOpt.right .kk{background:var(--ok);color:#042F18}
.qOpt.wrong{border-color:var(--no);background:rgba(229,72,77,.24)}
.qOpt.wrong .kk{background:var(--no)}
.qOpt.dim{opacity:.35}
.qOpt.hidden2 .tt{filter:blur(14px);opacity:.45}

/* verdict */
.vrd{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;text-align:center}
.vrd.on{display:flex}
.vrd.good{background:radial-gradient(65% 65% at 50% 50%,rgba(22,104,62,.96),rgba(5,22,13,.99))}
.vrd.bad{background:radial-gradient(65% 65% at 50% 50%,rgba(120,26,30,.96),rgba(26,5,7,.99))}
.vrd .big3{font-weight:800;font-size:clamp(44px,20vh,300px);line-height:.9;text-shadow:0 2vh 7vh rgba(0,0,0,.5)}
.vrd .ans3{font-weight:800;font-size:clamp(18px,5vh,70px);max-width:30ch;line-height:1.4}
.vrd .sc3{font-weight:800;font-size:clamp(16px,4vh,52px);color:var(--gold)}
.vrd .tm3{display:flex;align-items:center;gap:1vw;font-weight:800;font-size:clamp(14px,3.2vh,40px)}

/* scores */
.scWrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.1vh;justify-content:center}
.scRow{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:1.4vw;position:relative;overflow:hidden;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:1.6vh;padding:1.1vh 1.8vw;
  font-size:clamp(12px,2.8vh,34px);font-weight:800}
.scRow .rk{color:var(--muted);min-width:1.6em;text-align:center}
.scRow .pts{color:var(--gold);font-variant-numeric:tabular-nums;font-size:1.2em}
.scRow .fill{position:absolute;right:0;top:0;bottom:0;z-index:-1;transform-origin:right center;transform:scaleX(0);
  background:linear-gradient(90deg,transparent,rgba(232,194,90,.22));transition:transform 1.1s cubic-bezier(.2,.9,.25,1)}
.scRow.top1{border-color:rgba(232,194,90,.6);background:rgba(232,194,90,.1)}
canvas.conf{position:absolute;inset:0;z-index:80;pointer-events:none}
.trophy{font-size:clamp(40px,16vh,230px);line-height:1;filter:drop-shadow(0 1vh 5vh rgba(232,194,90,.7))}
.w2{font-weight:800;font-size:clamp(32px,12vh,180px);line-height:1;background:linear-gradient(160deg,#fff,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;padding:0 4vw}

/* print */
.printArea{display:none}
@media(max-width:860px){
  .ctrl{grid-template-columns:minmax(0,1fr)}.loc,.dsk{display:none!important}.scrState{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.scrState>div{margin-top:0!important}
  .tRow{grid-template-columns:auto minmax(0,1fr) 58px 54px}.tRow>*{min-width:0}.tRow .tools{grid-column:1/-1}.side,.main{min-width:0}#navBox{max-width:100%}
  .side{position:sticky;top:0;z-index:60;padding:8px 10px;gap:6px;border-left:none;border-bottom:1px solid var(--line)}
  .side .brand{display:none}#navBox{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .side .nav{width:auto;white-space:nowrap;padding:8px 11px;font-size:13px}.side .scrState{margin-top:0;padding:6px 10px}
  .main{padding:12px 12px 60px}.playTop{grid-template-columns:1fr auto}.playTop>span:last-child{display:none}
  .optBtn{padding:14px 12px;font-size:16px}}
/* lifelines & rules */
.btn.off{opacity:.35}
.finB{display:inline-block;background:rgba(229,72,77,.28);color:#FFC9C9;padding:.3vh .9vw;border-radius:99px;margin-inline-end:.6vw}
.llIc{display:inline-flex;gap:.35vw;margin-inline-start:1vw;vertical-align:middle}.llIc i{font-style:normal;font-size:1.15em}.llIc i.u{opacity:.22;filter:grayscale(1)}
.llBig{font-size:clamp(50px,20vh,280px);line-height:1}.llBig.pulse{animation:llP 1s ease-in-out infinite alternate}@keyframes llP{to{transform:scale(1.12)}}
.llClk{font-weight:800;font-size:clamp(40px,16vh,220px);color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}.llClk.hot{color:#FF6B6B}
.passRow{display:flex;align-items:center;gap:3vw}.passRow .arr{font-size:clamp(30px,12vh,160px);color:var(--gold);font-weight:800}
.vBars{display:flex;gap:3vw;align-items:flex-end;height:58vh;padding:0 4vw}
.vB{display:flex;flex-direction:column;align-items:center;gap:1vh;width:16vw}.vB.dim{opacity:.25}
.vCol{width:100%;height:38vh;background:rgba(255,255,255,.08);border-radius:1.4vh;display:flex;align-items:flex-end;overflow:hidden}
.vCol i{display:block;width:100%;height:0;background:linear-gradient(180deg,#8f84ff,#5b4fe0);border-radius:1.4vh;transition:height 1.6s cubic-bezier(.17,.84,.44,1)}
.vB.top .vCol i{background:linear-gradient(180deg,#F5DFA0,#C99A2E)}
.vP{font-weight:800;font-size:clamp(18px,5.4vh,72px)}.vB.top .vP{color:var(--gold)}
.vK{font-weight:800;font-size:clamp(16px,4vh,52px)}.vT{font-weight:700;font-size:clamp(11px,2.4vh,30px);color:var(--muted);text-align:center;line-height:1.3}
.rulesS{width:min(88vw,1500px);display:flex;flex-direction:column;gap:1.8vh}
.rH{font-weight:800;font-size:clamp(22px,6vh,80px);color:var(--gold);text-align:center;margin-bottom:1.4vh}.rH span{font-size:.45em;color:var(--muted);margin-inline-start:1vw}
.rR{display:flex;gap:2vw;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:2vh;padding:2vh 2.4vw;
  font-weight:700;font-size:clamp(14px,3.6vh,48px);line-height:1.45;animation:rIn .6s cubic-bezier(.17,.84,.44,1) backwards}
.rR b{flex:0 0 auto;width:7vh;height:7vh;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#F5DFA0,#C99A2E);color:#2a1d00;font-size:.9em}
@keyframes rIn{from{opacity:0;transform:translateX(-4vw)}}
.llGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2vh 2vw}
.llC{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:2.4vh;padding:3vh 1.6vw;text-align:center;display:flex;flex-direction:column;gap:1vh;animation:rIn .6s backwards}
.llC i{font-style:normal;font-size:clamp(30px,9vh,120px)}.llC b{font-size:clamp(16px,4.2vh,56px)}.llC span{font-size:clamp(11px,2.5vh,32px);color:var(--muted);font-weight:600}
@media print{
  body{background:#fff;color:#000}.ctrl,.stage,.veil,.toast,.miniCtl{display:none!important}
  .printArea{display:block!important}
  .pq{border:1px solid #bbb;border-radius:3mm;padding:4mm;margin-bottom:3mm;page-break-inside:avoid}
  .pq b{color:#2B2A6E}.pq ol{margin:2mm 0 0;padding-right:6mm}
  .pq .ans{color:#2FBF71;font-weight:700}
}
</style>

<body>
<div class="ctrl" id="ctrl">
  <aside class="side">
    <div class="brand"><span><img id="cLogo" alt=""></span><b>لوحة التحكم<br><small style="color:var(--muted)">المسابقة الثقافية</small></b></div>
    <div id="navBox"></div>
    <div class="scrState" id="linkBox"></div>
  </aside>
  <main class="main">
    <div class="nowShow" id="sbBar" style="display:none;background:linear-gradient(90deg,#8a5a00,#b98c2e);border:none">🧪 وضع التجربة — منفصل تمامًا عن المسابقة الحقيقية</div>
    <div class="nowShow" id="nowBox"></div>
    <div id="mainBox"></div>
  </main>
</div>
<div class="stage" id="stage">
  <div class="beams"></div>
  <div class="sHead"><img id="sLogo" alt=""><h1 id="sTitle"></h1><span class="ph" id="sPhase"></span></div>
  <div class="sBody" id="sBody"></div>
  <div class="ov" id="ov"></div>
  <div class="vrd" id="vrd"></div>
  <div class="miniCtl"><button class="btn sm" onclick="exitPresent()">✕ خروج من العرض</button></div>
</div>
<div class="fsHint" id="fsHint"><b>اضغط هنا لملء الشاشة</b><span>ثم تحكّم بكل شيء من لوحة التحكم على جهازك</span></div>
<div class="veil" id="veil" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<input type="file" id="fileIn" accept=".json" style="display:none">
<div class="printArea" id="printArea"></div>

        var b = bin.read();

        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

            } else {

              bytes.push(b & 0xff);
            }
          } else {

          }
        }
      }
      return bytes;
    };

let BANK=[];
async function unlockBank(pw){
  try{const E=BANK_ENC,b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode((pw||'').trim()),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.s),iterations:E.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},k,b64(E.ct));
    BANK=JSON.parse(new TextDecoder().decode(pt));return true;}catch(e){return false;}}

/* ---------- groups (flexible count) ---------- */
const GL=['A','B','C','D','E','F'];
function gList(){return GL.slice(0,Math.max(1,Math.min(6,Q.gcount||2)));}
function gInit(){const g={};gList().forEach(k=>{g[k]=(Q.groups&&Q.groups[k])||[];});Q.groups=g;return g;}
function capOf(k){const gs=gList(),n=Q.teams.length,i=gs.indexOf(k);
  const base=Math.floor(n/gs.length),rem=n%gs.length;return base+(i<rem?1:0);}
function placed(){const s=new Set();gList().forEach(k=>(Q.groups[k]||[]).forEach(x=>s.add(x)));return s;}
function remaining(){const u=placed();return Q.teams.filter(t=>!u.has(t.id));}
function nextGroup(){
  const gs=gList();
  let best=gs[0],bd=1e9;
  gs.forEach(k=>{const d=(Q.groups[k]||[]).length-0;const room=capOf(k)-d;
    if(room>0&&d<bd){bd=d;best=k;}});
  return best;
}
function classIn(k,c){return c&&(Q.groups[k]||[]).some(x=>clsOf(x)===c);}
function groupFor(id){
  const turn=nextGroup();
  if(Q.splitClass===false)return {g:turn,swapped:false};
  const c=clsOf(id);
  if(!c)return {g:turn,swapped:false};
  if(!classIn(turn,c))return {g:turn,swapped:false};
  const alt=gList().find(k=>k!==turn&&!classIn(k,c)&&(Q.groups[k]||[]).length<capOf(k));
  return alt?{g:alt,swapped:true,cls:c}:{g:turn,swapped:false};
}
function groupOfTeam(id){return gList().find(k=>(Q.groups[k]||[]).includes(id))||'';}

function subjOf(g){const all=allQs().filter(x=>(x.g||0)===g).map(x=>x.c);

let AC=null,BUS=null,REV=null,SND={};
function ac(){

  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  AC=new C();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.25;
  const master=AC.createGain();master.gain.value=.9;comp.connect(master);master.connect(AC.destination);
  BUS=AC.createGain();BUS.connect(comp);
  const len=AC.sampleRate*2.6,ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);}
  REV=AC.createConvolver();REV.buffer=ir;const rg=AC.createGain();rg.gain.value=.3;REV.connect(rg);rg.connect(comp);

function out(node,wet){node.connect(BUS);if(wet)node.connect(REV);}

  const n=c.createBufferSource();n.buffer=noiseBuf(.2);const f2=c.createBiquadFilter();f2.type='lowpass';f2.frequency.value=900;

  if(!cv){cv=document.createElement('canvas');cv.className='conf';host.appendChild(cv);}
  const w=cv.width=host.clientWidth,h=cv.height=host.clientHeight,x=cv.getContext('2d');

  const P=[...Array(Math.round(Math.min(300,w/5)))].map(()=>({x:Math.random()*w,y:-20-Math.random()*h*.6,vx:(Math.random()-.5)*3,
    vy:2+Math.random()*4,s:6+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();if(confRaf)cancelAnimationFrame(confRaf);
  const step=()=>{x.clearRect(0,0,w,h);let alive=false;
    P.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.vy+=.05;o.r+=o.vr;if(o.y<h+30)alive=true;
      x.save();x.translate(o.x,o.y);x.rotate(o.r);x.fillStyle=o.c;x.fillRect(-o.s/2,-o.s/4,o.s,o.s/2);x.restore();});
    if(alive&&performance.now()-t0<(ms||7000))confRaf=requestAnimationFrame(step);else{x.clearRect(0,0,w,h);confRaf=null;}};
  step();
}

/* ===================== REMOTE LINK (internet) =====================
   Control ⇄ Screen over the internet with a 6-char room code.
   Channels in parallel: WebRTC (PeerJS) + public MQTT brokers. Every frame goes on every live channel; receiver dedupes. */
const RCH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function rcode(n){const a=new Uint32Array(n);(window.crypto||window.msCrypto).getRandomValues(a);let s='';a.forEach(v=>s+=RCH[v%RCH.length]);return s;}
const RM_BROKERS=(window.RM_TEST&&RM_TEST.brokers)||['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const RM_POPT=Object.assign({debug:0},(window.RM_TEST&&RM_TEST.peer)||{});
const RM={role:'',code:'',key:'',me:rcode(12),seq:0,chans:[],parts:{},seen:{},lastQn:{},last:0,lastQ:'',
  trusted:[],openUntil:0,everCtrl:false,deniedAt:0,denied:false,peer:null,conns:[],wake:null,dead:false};
const RM_TOP=()=>'mjcq1/'+RM.code;
function rmLoad(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{};}catch(e){return {};}}
function rmSave(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---- MQTT 3.1.1 over WebSocket (QoS 0) ---- */
function mqttChan(url){
  const te=new TextEncoder(),td=new TextDecoder();
  const cat=(...a)=>{const n=a.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n);let p=0;a.forEach(x=>{o.set(x,p);p+=x.length;});return o;};
  const s16=s=>{const b=te.encode(s);return cat(new Uint8Array([b.length>>8,b.length&255]),b);};
  const pkt=(t,body)=>{const L=[];let x=body.length;do{let d=x%128;x=Math.floor(x/128);if(x>0)d|=128;L.push(d);}while(x>0);
    return cat(new Uint8Array([t]),new Uint8Array(L),body);};
  const ch={name:'mqtt',label:url.split('//')[1].split(/[.:]/)[1]||url,ok:false,ws:null,buf:new Uint8Array(0),tries:0,rx:0,pingT:null,stopped:false};
  const sub=()=>RM_TOP()+(RM.role==='screen'?'/s':'/c'),pub=()=>RM_TOP()+(RM.role==='screen'?'/c':'/s');
  function retry(){if(ch.stopped)return;ch.tries++;setTimeout(ch.start,Math.min(15000,800*ch.tries));}
  function down(ws){if(ch.ws!==ws)return;ch.ok=false;ch.ws=null;clearInterval(ch.pingT);try{ws.close();}catch(e){}rmStatus();retry();}
  ch.start=()=>{
    if(ch.stopped||!RM.code)return;
    let ws;try{ws=new WebSocket(url,'mqtt');}catch(e){retry();return;}
    ch.ws=ws;ch.buf=new Uint8Array(0);ws.binaryType='arraybuffer';
    ws.onopen=()=>{ws.send(pkt(0x10,cat(s16('MQTT'),new Uint8Array([4,2,0,40]),s16('mj'+rcode(14)))));};
    ws.onmessage=e=>{ch.rx=Date.now();ch.buf=cat(ch.buf,new Uint8Array(e.data));parse(ws);};
    ws.onclose=()=>down(ws);ws.onerror=()=>down(ws);
  };
  function parse(ws){
    while(ch.buf.length>=2){
      let m=1,len=0,i=1,d;do{if(i>=ch.buf.length)return;d=ch.buf[i++];len+=(d&127)*m;m*=128;}while(d&128);
      if(ch.buf.length<i+len)return;
      const h=ch.buf[0],t=h>>4,b=ch.buf.slice(i,i+len);ch.buf=ch.buf.slice(i+len);
      if(t===2){if(b[1]!==0){down(ws);return;}
        ch.tries=0;ws.send(pkt(0x82,cat(new Uint8Array([0,1]),s16(sub()),new Uint8Array([0]))));
        ch.ok=true;rmStatus();rmUp();
        clearInterval(ch.pingT);ch.pingT=setInterval(()=>{if(Date.now()-ch.rx>50000){down(ws);return;}try{ws.send(new Uint8Array([0xC0,0]));}catch(e){}},15000);}
      else if(t===3){const tl=(b[0]<<8)|b[1];let p=2+tl;if((h>>1)&3)p+=2;rmFrame(td.decode(b.slice(p)));}
    }
  }
  ch.send=s=>{if(ch.ok&&ch.ws)try{ch.ws.send(pkt(0x30,cat(s16(pub()),te.encode(s))));}catch(e){}};
  ch.stop=()=>{ch.stopped=true;ch.ok=false;clearInterval(ch.pingT);if(ch.ws)try{ch.ws.close();}catch(e){}ch.ws=null;};
  return ch;
}

/* ---- WebRTC via PeerJS ---- */
function peerChan(){
  const ch={name:'p2p',label:'مباشر',ok:false,stopped:false,peer:null,conns:[],t:null};
  const pid=()=>'mjcq1-'+RM.code.toLowerCase();
  const live=()=>{ch.conns=ch.conns.filter(c=>c.open);ch.ok=ch.conns.length>0;rmStatus();};
  function wire(c){
    c.on('open',()=>{ch.conns.push(c);live();rmUp();});
    c.on('data',d=>{if(typeof d==='string')rmFrame(d);});
    c.on('close',()=>{live();if(RM.role==='ctrl')again(3000);});
    c.on('error',()=>{live();});
  }
  function again(ms){if(ch.stopped)return;clearTimeout(ch.t);ch.t=setTimeout(go,ms);}
  function go(){
    if(ch.stopped||!RM.code||typeof Peer==='undefined')return;
    if(RM.role==='ctrl'){
      if(ch.conns.some(c=>c.open))return;
      if(!ch.peer||ch.peer.destroyed){ch.peer=new Peer(RM_POPT);
        ch.peer.on('open',()=>go());
        ch.peer.on('disconnected',()=>{if(!ch.stopped&&ch.peer&&!ch.peer.destroyed)try{ch.peer.reconnect();}catch(e){}});
        ch.peer.on('error',e=>{const ty=e&&e.type;if(ty==='peer-unavailable')again(5000);
          else if(['network','server-error','socket-error','socket-closed'].includes(ty)){try{ch.peer.destroy();}catch(_){}ch.peer=null;again(6000);}});
        return;}
      if(!ch.peer.open){again(2000);return;}
      const c=ch.peer.connect(pid(),{reliable:true,serialization:'raw'});wire(c);again(9000);
    }else{
      if(ch.peer&&!ch.peer.destroyed)return;
      ch.peer=new Peer(pid(),RM_POPT);
      ch.peer.on('connection',c=>wire(c));
      ch.peer.on('disconnected',()=>{if(!ch.stopped&&ch.peer&&!ch.peer.destroyed)try{ch.peer.reconnect();}catch(e){}});
      ch.peer.on('error',e=>{const ty=e&&e.type;
        if(['unavailable-id','network','server-error','socket-error','socket-closed'].includes(ty)){try{ch.peer.destroy();}catch(_){}ch.peer=null;again(ty==='unavailable-id'?8000:6000);}});
    }
  }
  ch.start=go;
  ch.send=s=>{ch.conns.forEach(c=>{if(c.open)try{c.send(s);}catch(e){}});};
  ch.stop=()=>{ch.stopped=true;clearTimeout(ch.t);ch.conns.forEach(c=>{try{c.close();}catch(e){}});ch.conns=[];ch.ok=false;if(ch.peer)try{ch.peer.destroy();}catch(e){}ch.peer=null;};
  return ch;
}

/* ---- framing ---- */
function rmSend(msg){
  if(!RM.role||!RM.chans.some(c=>c.ok))return false;
  let m=msg;
  if(RM.role==='ctrl'&&m&&m.Q){const qs=JSON.stringify(m.Q);if(qs===RM.lastQ){m=Object.assign({},m);delete m.Q;}else RM.lastQ=qs;}
  const s=JSON.stringify(m),n=++RM.seq,CH=30000,c=Math.max(1,Math.ceil(s.length/CH));
  for(let i=0;i<c;i++){const fr=JSON.stringify({f:RM.me,k:RM.role==='ctrl'?RM.key:'',n,i,c,d:s.slice(i*CH,(i+1)*CH)});
    RM.chans.forEach(ch=>{if(ch.ok)ch.send(fr);});}
  return true;
}
function rmFrame(str){
  let F;try{F=JSON.parse(str);}catch(e){return;}
  if(!F||F.f===RM.me||typeof F.d!=='string')return;
  const sn=RM.seen[F.f]||(RM.seen[F.f]=new Set());if(sn.has(F.n))return;
  const id=F.f+':'+F.n,P=RM.parts[id]||(RM.parts[id]={a:new Array(F.c),got:0,t:Date.now()});
  if(P.a[F.i]!=null)return;P.a[F.i]=F.d;P.got++;
  if(P.got<F.c)return;
  delete RM.parts[id];sn.add(F.n);if(sn.size>800){const it=sn.values();for(let k=0;k<300;k++)sn.delete(it.next().value);}
  let d;try{d=JSON.parse(P.a.join(''));}catch(e){return;}
  if(d&&d.Q){const ln=RM.lastQn[F.f]||0;if(F.n<ln)delete d.Q;else RM.lastQn[F.f]=F.n;}
  if(RM.role==='screen')rmScreenIn(d,F.k);else rmCtrlIn(d);
}
setInterval(()=>{const now=Date.now();for(const k in RM.parts)if(now-RM.parts[k].t>30000)delete RM.parts[k];},10000);

function rmStart(role,code){
  rmStop();RM.role=role;RM.code=code;RM.dead=false;
  RM.chans=[peerChan()].concat(RM_BROKERS.map(mqttChan));
  RM.chans.forEach(c=>{try{c.start();}catch(e){}});
  rmStatus();
}
function rmStop(){RM.chans.forEach(c=>{try{c.stop();}catch(e){}});RM.chans=[];RM.role='';RM.last=0;RM.lastQ='';rmStatus();}
function rmTk(){return {tk:RM.trusted.map(k=>k.slice(0,5)),open:rmPairOpen(),sid:Q.sid||'',ts:Q.ts||0,nt:(Q.teams||[]).length};}
function rmUp(){if(RM.role==='screen')rmSend(Object.assign({t:'hello',scr:1},rmTk()));else{RM.lastQ='';rmSend({t:'ping'});}}
function rmLive(){return RM.role==='ctrl'&&Date.now()-RM.last<8000;}
function rmStatus(){if(typeof rmPaint==='function')rmPaint();}

/* ---- control side ---- */
function rmCtrlIn(d){
  if(!d||!d.t)return;
  const was=rmLive();
  if(d.t==='hello'||d.t==='alive'){
    if(d.tk&&!d.tk.includes(RM.key.slice(0,5))){RM.last=0;if(d.open){rmSend({t:'ping'});}else if(!RM.denied){RM.denied=true;rmDeniedToast();rmStatus();}return;}
    RM.last=Date.now();RM.denied=false;
    if(d.t==='hello'||!was){rmSync(d);if(typeof pushSounds==='function')pushSounds();
      if(!was&&typeof toast==='function')toast('✓ شاشة العرض متصلة عن بُعد.');}
    if(typeof refreshLink==='function'&&!was)refreshLink();return;}
  if(d.t==='denied'){RM.denied=true;rmDeniedToast();rmStatus();return;}
  if(d.t==='full'&&d.Q){rmPullGot(d.Q);return;}
}
function rmDeniedToast(){if(Date.now()-RM.deniedAt>8000){RM.deniedAt=Date.now();
  toast('الشاشة مرتبطة بجهاز تحكم آخر — على شاشة العرض اضغط «ربط جهاز جديد»، أو من الجهاز المرتبط اضغط «السماح بجهاز إضافي».',9000);}}
setInterval(()=>{if(RM.role==='ctrl')rmSend({t:'ping'});},3000);
function rmCtrlBoot(){
  const s=rmLoad('cq-rm-ctrl');RM.key=s.key||rcode(16);if(!s.key)rmSave('cq-rm-ctrl',{key:RM.key,code:s.code||''});
  const qp=new URLSearchParams(location.search).get('join');
  const code=((qp||s.code||'')+'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(qp)try{history.replaceState(null,'',location.pathname);}catch(e){}
  if(code.length===6)rmJoin(code,true);
}
function rmJoin(code,quiet){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6){toast('الرمز ٦ خانات — كما يظهر على شاشة العرض.');return;}
  rmSave('cq-rm-ctrl',{key:RM.key,code});rmStart('ctrl',code);rmWake();
  if(!quiet)toast('جارٍ الاتصال بالشاشة '+code+' …');
}
function rmLeave(){rmSave('cq-rm-ctrl',{key:RM.key,code:''});rmStop();if(RM.wake)try{RM.wake.release();}catch(e){}RM.wake=null;
  if(typeof renderCtrl==='function')renderCtrl();}
async function rmWake(){try{if(navigator.wakeLock&&!RM.wake){RM.wake=await navigator.wakeLock.request('screen');RM.wake.addEventListener('release',()=>{RM.wake=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&RM.role==='ctrl'){rmWake();RM.chans.forEach(c=>{if(!c.ok&&c.start)try{c.start();}catch(e){}});}});
let rmPullCb=null;
function rmPull(){if(!rmLive()){toast('الشاشة غير متصلة الآن.');return;}rmPullCb=1;rmSend({t:'pull'});toast('جارٍ طلب البيانات من الشاشة…');}
function rmPush(){RM.lastQ='';rmSend({t:'state',Q});}
function rmSync(d){
  if(d.sid&&d.sid===Q.sid){if((d.ts||0)>(Q.ts||0)){rmPullCb=2;rmSend({t:'pull'});}else rmPush();return;}
  if(!d.nt){rmPush();return;}
  if(!Q.teams.length){rmPullCb=2;rmSend({t:'pull'});return;}
  if(confirm('شاشة العرض عليها مسابقة مختلفة ('+d.nt+' فريقًا) عن الموجودة في هذا الجهاز ('+Q.teams.length+' فريقًا).\n\nموافق = اعرض بيانات هذا الجهاز على الشاشة\nإلغاء = انقل بيانات الشاشة إلى هذا الجهاز'))rmPush();
  else{rmPullCb=2;rmSend({t:'pull'});}
}
function rmPullGot(q){if(!rmPullCb)return;const auto=rmPullCb===2;rmPullCb=null;
  if(!auto&&!confirm('وصلت بيانات المسابقة من الشاشة ('+(q.teams||[]).length+' فريقًا). استبدال بيانات هذا الجهاز بها؟'))return;
  const ts=q.ts;Q=Object.assign(blank(),q);gInit();save();Q.ts=ts||Q.ts;try{localStorage.setItem(KEY,JSON.stringify(Q));}catch(e){}
  RM.lastQ=JSON.stringify(Q);renderCtrl();toast('✓ نُقلت المسابقة من الشاشة إلى هذا الجهاز ('+Q.teams.length+' فريقًا).');}

/* ---- screen side ---- */
function rmScreenBoot(){
  const s=rmLoad('cq-rm-scr');RM.code=s.code||rcode(6);RM.trusted=s.trusted||[];
  if(!s.code)rmSave('cq-rm-scr',{code:RM.code,trusted:RM.trusted});
  try{const lq=localStorage.getItem('cq-rm-lastQ');if(lq){Q=Object.assign(blank(),JSON.parse(lq));}}catch(e){}
  rmStart('screen',RM.code);
  setInterval(()=>{rmSend(Object.assign({t:'alive',scr:1},rmTk()));rmPaint();},2000);
  document.addEventListener('keydown',e=>{if(e.key==='p'||e.key==='P'||e.key==='ح')rmOpenPair();});
  rmPaint();
}
function rmPairOpen(){return !RM.trusted.length||RM.openUntil>Date.now();}
function rmOpenPair(){RM.openUntil=Date.now()+180000;rmPaint();}
function rmScreenIn(d,k){
  if(!d||!d.t||!k)return;
  if(!RM.trusted.includes(k)){
    if(!rmPairOpen()){if(Date.now()-RM.deniedAt>3000){RM.deniedAt=Date.now();rmSend({t:'denied'});}return;}
    RM.trusted.push(k);RM.trusted=RM.trusted.slice(-6);RM.openUntil=0;rmSave('cq-rm-scr',{code:RM.code,trusted:RM.trusted});
  }
  const fresh=Date.now()-RM.last>8000;RM.last=Date.now();RM.everCtrl=true;
  if(fresh)rmSend(Object.assign({t:'hello',scr:1},rmTk()));
  if(d.t==='allow'){rmOpenPair();return;}
  if(d.t==='forget'){RM.trusted=[k];rmSave('cq-rm-scr',{code:RM.code,trusted:RM.trusted});return;}
  if(d.t==='pull'){rmSend({t:'full',Q});return;}
  if(d.t==='ping'){rmPaint();return;}
  scrMsg(d);
  if(d.Q){clearTimeout(rmScreenIn.t);rmScreenIn.t=setTimeout(()=>{try{localStorage.setItem('cq-rm-lastQ',JSON.stringify(Q));}catch(e){}},1500);}
  rmPaint();
}
function rmQR(text,px){
  if(typeof qrcode==='undefined')return '';
  try{const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),c=Math.max(2,Math.floor(px/(n+8)));
    return q.createSvgTag({cellSize:c,margin:c*4,scalable:true});}catch(e){return '';}
}
function rmPaint(){
  if(RM.role!=='screen'){if(typeof refreshLink==='function'&&el('linkBox'))refreshLink();const rc=el('rmCard');if(typeof rmCard==='function'&&TAB==='screen'&&rc&&!rc.contains(document.activeElement))rc.outerHTML=rmCard();return;}
  let o=el('rmOv');if(!o){o=document.createElement('div');o.id='rmOv';document.body.appendChild(o);}
  const live=Date.now()-RM.last<8000,net=RM.chans.some(c=>c.ok),open=rmPairOpen();
  if(live){o.className='';o.innerHTML='';return;}
  if(RM.everCtrl){o.className='rmLost';o.innerHTML='<span class="dot"></span>'+(net?'بانتظار لوحة التحكم…':'لا يوجد اتصال بالإنترنت — جارٍ إعادة المحاولة');return;}
  const url=/^https?:/.test(location.protocol)?location.href.split('?')[0].split('#')[0]+'?join='+RM.code:'';
  const qr=open&&url?rmQR(url,300):'';
  o.className='rmPair';
  o.innerHTML='<div class="rmBox"><img src="'+LOGO+'" class="rmLogo"><div class="rmT">شاشة العرض</div>'
    +(open?'<div class="rmS">من جوالك أو جهازك افتح الرابط نفسه ← «الشاشة» ← «الربط عن بُعد» واكتب الرمز:</div>'
      +'<div class="rmCode">'+RM.code.split('').map(ch=>'<span>'+ch+'</span>').join('')+'</div>'
      +(qr?'<div class="rmQR">'+qr+'<div>أو امسح الرمز بكاميرا الجوال</div></div>':'')
     :'<div class="rmS">بانتظار لوحة التحكم المرتبطة…</div><button class="rmBtn" onclick="rmOpenPair()">ربط جهاز جديد</button>')
    +'<div class="rmNet">'+RM.chans.map(c=>'<i class="'+(c.ok?'on':'')+'" title="'+esc(c.label)+'"></i>').join('')
    +' '+(net?'متصل بالإنترنت':'جارٍ الاتصال بالإنترنت…')+'</div></div>';
}

const PH={idle:'',teams:'الفرق المشاركة',draw:'قرعة المجموعات',play:'السؤال',scores:'ترتيب الفرق',
  groups:'ترتيب المجموعات',champion:'البطل',cats:'فئات الأسئلة',rules:'قوانين المسابقة',lifelines:'وسائل المساعدة'};

function scCats(){

function slotsCol(k,hl){

function scDraw(v){gInit();return '<div class="drawGrid" style="--g:'+gList().length+'">'+gList().map(k=>slotsCol(k,v.hl)).join('')+'</div>';}

/* ---- question ---- */
const KEYS=['أ','ب','ج','د'];
function scPlay(){
  const P=Q.play||{};
  if(!P.q)return '<div class="idle"><div class="st">بانتظار السؤال…</div></div>';
  const q=P.q,tid=P.tid,ph=P.phase;
  const long=(q.q||'').length>70;
  const tot=Q.secs||30,left=P.secs==null?tot:P.secs;
  const C=2*Math.PI*45,off=C*(1-left/tot);
  const ring='<div class="ring'+(left<=5?' hot':(left<=10?' warn':''))+'" id="ring"><svg viewBox="0 0 100 100">'
    +'<circle class="bg2" cx="50" cy="50" r="45"/><circle class="fg2" id="ringFg" cx="50" cy="50" r="45" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'
    +'<b id="ringN">'+left+'</b></div>';
  const hid=P.hide||[];
  const opts=q.o.map((o,i)=>{
    let cls='qOpt';
    if(ph==='reveal'){if(i===q.a)cls+=' right';else if(i===P.pick)cls+=' wrong';else cls+=' dim';}
    else if(P.pick===i)cls+=' pick';
    if(hid.includes(i)&&ph!=='reveal')cls+=' dim';
    if(ph==='ready')cls+=' hidden2';
    return '<div class="'+cls+'" data-i="'+i+'"><span class="kk">'+KEYS[i]+'</span><span class="tt">'+esc(o)+'</span></div>';}).join('');
  return '<div class="qS">'
    +'<div class="qTop"><div class="tn2">'+shield(tid,'6vh')+'<span>'+nm(tid)+clsTag(tid)+'</span></div>'
    +'<span class="cat2 cat '+catCls(q.c)+'">'+(SICON[q.c]||'')+' '+esc(catLbl(q))+'</span>'
    +'<span class="idx">'+(Q.final?'<span class="finB">🔥 الجولة النهائية</span> ':'')+(P.half?'<span class="finB" style="background:rgba(0,172,193,.25)">🔄 نصف النقاط</span> ':'')
      +(P.from?'↪️ محوّل · ':'السؤال '+(P.n||1)+' من '+(Q.perTeam||3)+' · ')+'رصيد الفريق '+(T(tid).score||0)+llIcons(tid)+'</span></div>'
    +'<div class="qBody"><div class="qText'+(long?' long':'')+'">'+esc(q.q)+'</div>'+ring+'</div>'
    +'<div class="qOpts">'+opts+'</div></div>';
}
function tickRing(left){
  const tot=Q.secs||30,r=el('ring'),fg=el('ringFg'),n=el('ringN');if(!r||!fg)return;
  const C=2*Math.PI*45;fg.setAttribute('stroke-dashoffset',(C*(1-left/tot)).toFixed(1));
  n.textContent=left;r.className='ring'+(left<=5?' hot':(left<=10?' warn':''));
}

function ranked(ids){return ids.map(id=>T(id)).sort((a,b)=>(b.score||0)-(a.score||0)||(b.right||0)-(a.right||0));}
function scoreRows(list){const mx=Math.max(1,...list.map(t=>t.score||0));

    +'<span class="pts">'+(t.score||0)+'</span></div>').join('');}
function scScores(){const L2=ranked(Q.teams.map(t=>t.id)).slice(0,12);

function scChamp(v){return '<div class="idle"><div class="trophy">🏆</div><div class="st">بطل '+esc(Q.name||'')+'</div>'
  +shield(v.id,'16vh')+'<div class="w2">'+nm(v.id)+'</div><div class="st" style="color:var(--gold)">'+(T(v.id).score||0)+' نقطة</div></div>';}

/* ===================== EFFECTS ===================== */
function ovShow(html,cls,ms,persist){const o=el('ov');o.className='ov on '+(cls||'');o.innerHTML=html;
  if(persist)o.dataset.persist=persist;else delete o.dataset.persist;
  clearTimeout(ovShow.t);if(ms)ovShow.t=setTimeout(()=>{o.className='ov';o.innerHTML='';renderStage();},ms);return o;}
function playFX(f){
  if(!f)return;ac();const k=f.k;
  if(k==='suspense'){SFX.suspense(f.ms);return;}
  if(k==='tick'){SFX.tick(f.fast);return;}
  if(k==='clock'){Q.play.secs=f.secs;tickRing(f.secs);return;}
  if(k==='timeup'){SFX.timeup();const r=el('ring');if(r)r.classList.add('shake');return;}
  if(k==='place'){renderStage();const s=document.querySelector('.slot.flash');SFX.tick(true);return;}
  if(k==='reveal'){const t=T(f.id);
    ovShow('<div class="rays"></div><div class="lbl">'+esc(f.label||'')+'</div><div class="slam">'+shield(f.id,'22vh')+'</div>'
      +'<div class="nm slam" style="text-shadow:0 1vh 6vh '+t.color+'">'+esc(t.name)+clsTag(f.id)+'</div>'+(f.to?'<div class="to">'+esc(f.to)+'</div>':''),'',f.ms||2600);
    SFX.reveal();setTimeout(()=>{const n=el('ov').querySelector('.nm');if(n)n.classList.add('shake');},700);return;}
  if(k==='team'){const t=T(f.id);
    ovShow('<div class="rays"></div><div class="lbl">الدور على</div><div class="slam">'+shield(f.id,'24vh')+'</div>'
      +'<div class="nm slam">'+esc(t.name)+clsTag(f.id)+'</div><div class="to">السؤال '+f.n+' — '+esc(f.cat||'')+'</div>','',2600);
    SFX.suspense(1400);setTimeout(()=>SFX.reveal(),1300);return;}
  if(k==='showq'){renderStage();SFX.start();
    const q=document.querySelector('.qText');if(q)q.animate([{opacity:0,transform:'scale(.9) translateY(20px)'},{opacity:1,transform:'none'}],{duration:650,easing:'cubic-bezier(.2,1.2,.3,1)'});
    document.querySelectorAll('.qOpt').forEach((o,i)=>o.animate([{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],{duration:520,delay:250+i*110,fill:'backwards',easing:'cubic-bezier(.17,.84,.44,1)'}));
    return;}
  if(k==='opts'){renderStage();
    document.querySelectorAll('.qOpt').forEach((o,i)=>o.animate([{opacity:0,transform:'translateY(30px) scale(.95)'},{opacity:1,transform:'none'}],{duration:520,delay:i*120,fill:'backwards',easing:'cubic-bezier(.2,1.3,.3,1)'}));
    SFX.start();return;}
  if(k==='pick'){renderStage();SFX.suspense(f.ms||1800);
    const p=document.querySelector('.qOpt.pick');if(p)p.animate([{boxShadow:'0 0 0 0 rgba(124,107,240,.0)'},{boxShadow:'0 0 0 1.4vh rgba(124,107,240,.35)'},{boxShadow:'0 0 0 0 rgba(124,107,240,.0)'}],{duration:600,iterations:3});
    return;}
  if(k==='half'){renderStage();SFX.reveal();return;}
  if(k==='llfx'){llFX(f);return;}
  if(k==='llclock'){const c=el('llClk2');if(c){c.textContent=f.secs;c.classList.toggle('hot',f.secs<=5);}if(f.secs>0)SFX.tick(f.secs<=5);else SFX.timeup();return;}
  if(k==='llend'){const o=el('ov');o.className='ov';o.innerHTML='';delete o.dataset.persist;renderStage();return;}
  if(k==='verdict'){renderStage();
    const P=Q.play,q=P.q,good=f.good,tid=P.tid;
    setTimeout(()=>{
      const v=el('vrd');v.className='vrd on '+(good?'good':'bad');
      v.innerHTML='<div class="big3 slam">'+(good?'✓ إجابة صحيحة':(P.pick==null?'⏱ انتهى الوقت':'✕ إجابة خاطئة'))+'</div>'
        +'<div class="tm3">'+shield(tid,'7vh')+nm(tid)+clsTag(tid)+'</div>'
        +(good?'<div class="sc3 slam">+'+f.pts+' '+(f.pts===1?'نقطة':'نقاط')+' · الرصيد '+(T(tid).score||0)+'</div>'
          :'<div class="ans3">الإجابة الصحيحة: <span style="color:#6BE0A4">'+esc(q.o[q.a])+'</span></div>'
           +(f.pts<0?'<div class="sc3 slam" style="color:#FF9DA0">🔥 خصم '+(-f.pts)+' · الرصيد '+(T(tid).score||0)+'</div>':''));
      if(good){SFX.good();confetti(4200);}else{SFX.bad();v.querySelector('.big3').classList.add('shake');}
      clearTimeout(playFX.vt);playFX.vt=setTimeout(()=>{v.className='vrd';v.innerHTML='';},f.hold||5200);
    },650);
    return;}
  if(k==='champion'){ovShow('<div class="rays"></div><div class="trophy slam">🏆</div><div class="lbl">بطل '+esc(Q.name||'')+'</div>'
      +'<div class="slam">'+shield(f.id,'18vh')+'</div><div class="w2 slam">'+nm(f.id)+'</div>','',0,'champion');
    SFX.win(true);confetti(12000,true);setTimeout(()=>confetti(9000),4000);return;}
  if(k==='roulette'){const ids=f.ids;
    ovShow('<div class="rays"></div><div class="lbl">'+esc(f.title||'')+'</div><div class="roul">'
      +ids.map(id=>'<div class="rc">'+shield(id,'10vh')+'<div>'+nm(id)+'</div></div>').join('')+'</div>','',0);
    SFX.suspense(f.ms||3600);
    const cells=[...el('ov').querySelectorAll('.rc')];let i=0,delay=70,total=0;const winIdx=ids.indexOf(f.win);
    const spin=()=>{cells.forEach(c=>c.classList.remove('hot'));cells[i%cells.length].classList.add('hot');total+=delay;
      if(total>(f.ms||3600)-400&&i%cells.length===winIdx){cells.forEach(c=>c.classList.remove('hot'));cells[winIdx].classList.add('win');
        setTimeout(()=>{ovShow('<div class="rays"></div><div class="lbl">'+esc(f.title||'')+'</div><div class="slam">'+shield(f.win,'22vh')+'</div>'
          +'<div class="nm slam" style="color:var(--gold)">'+nm(f.win)+'</div><div class="to">'+esc(f.sub||'')+'</div>','',f.hold||3500);
          SFX.reveal();},350);return;}
      i++;delay=Math.min(380,delay*1.07);setTimeout(spin,delay);};
    spin();return;}
  if(k==='confetti'){SFX.win(false);confetti(5000,true);return;}
  if(k==='close'){const o=el('ov');o.className='ov';o.innerHTML='';const v=el('vrd');v.className='vrd';v.innerHTML='';renderStage();return;}
}

function setG(n){if(Q.drawLog.length)return;Q.gcount=n;Q.groups={};gInit();save();renderCtrl();show({s:'draw'});}
function place(id){const p=groupFor(id);Q.groups[p.g].push(id);Q.drawLog.push({id,g:p.g});return p;}
async function fastDraw(){
  if(BUSY)return;BUSY=true;renderCtrl();gInit();
  show({s:'draw'});await wait(300);
  fx({k:'suspense',ms:1600});await wait(1600);
  const order=shuffle(remaining().map(t=>t.id));
  for(const id of order){place(id);save();
    if(screenLinked())sendScr({t:'state',Q:Object.assign({},Q,{view:{s:'draw',hl:id}})});
    else{Q.view={s:'draw',hl:id};renderStage();}
    fx({k:'tick',fast:true});await wait(260);}
  Q.view={s:'draw'};save();sync();fx({k:'confetti'});
  BUSY=false;Q.order=[];renderCtrl();toast('اكتملت القرعة.',4000);
}
async function drawPick(id,label){
  if(BUSY||!remaining().some(t=>t.id===id))return;BUSY=true;renderCtrl();
  const p=groupFor(id);
  fx({k:'suspense',ms:1500});await wait(1500);
  fx({k:'reveal',id,label:label||'الفريق المسحوب',to:'← المجموعة '+p.g+(p.swapped?' (فصل '+p.cls+' في مجموعة أخرى)':'')});
  await wait(2700);

function doSwap(){const a=el('swA').value,b=el('swB').value,ga=groupOfTeam(a),gb=groupOfTeam(b);

  Q.drawLog.forEach(x=>{if(x.id===a)x.g=gb;else if(x.id===b)x.g=ga;});Q.order=[];

/* ---------- order of turns ---------- */
function teamsInPlay(){const s=placed();return s.size?[...s]:Q.teams.map(t=>t.id);}
function buildOrder(){
  const gs=gList(),per=Q.perTeam||3,out=[];
  const lists=placed().size?gs.map(k=>(Q.groups[k]||[]).slice()):[Q.teams.map(t=>t.id)];
  const mx=Math.max(...lists.map(l=>l.length),0);
  for(let r=1;r<=per;r++)for(let i=0;i<mx;i++)lists.forEach(l=>{if(l[i])out.push({tid:l[i],n:r});});
  Q.order=out;Q.turn=0;save();
}
function curTurn(){if(!Q.order||!Q.order.length)buildOrder();return Q.order[Q.turn]||null;}

function pickTeamModal(){
  const ids=teamsInPlay();
  modal('<h3>اختيار فريق</h3><div class="row">'+ids.map(id=>'<button class="btn" onclick="forceTeam(\''+id+'\')">'+nmc(id)+'</button>').join('')+'</div>'
    +'<div class="row" style="margin-top:12px"><button class="btn" onclick="closeModal()">إلغاء</button></div>');}
function forceTeam(id){closeModal();if(!Q.order||!Q.order.length)buildOrder();
  const j=Q.order.findIndex((x,i)=>i>=Q.turn&&x.tid===id);
  if(j>Q.turn){const it=Q.order.splice(j,1)[0];Q.order.splice(Q.turn,0,it);}
  else if(j<0)Q.order.splice(Q.turn,0,{tid:id,n:(T(id).asked||0)+1});
  save();renderCtrl();}
function skipTurn(){stopClock();Q.turn=Math.min((Q.turn||0)+1,(Q.order||[]).length);Q.play={tid:'',q:null,phase:'idle'};save();renderCtrl();}
async function startTurn(cat){
  if(BUSY)return;if(!BANK.length){askBankPw();return;}const t=curTurn();if(!t)return;
  const g=qGrade(t.tid),q=pickQ(cat||'',g);
  if(!q){toast(cat?'لا توجد أسئلة متبقية في '+cat+(g?' — '+GN[g]:'')+'.':'انتهت أسئلة '+(g?GN[g]:'البنك')+' — أعد تعيين المستخدمة من تبويب البنك.',7000);return;}
  const ord=shuffle([0,1,2,3]),qo=ord.map(k=>q.o[k]),qa=ord.indexOf(q.a);
  BUSY=true;stopClock();
  Q.used=(Q.used||[]).concat([q.i]);
  Q.play={tid:t.tid,q:{c:q.c,g:q.g||0,q:q.q,o:qo,a:qa,i:q.i},phase:'ready',pick:null,secs:Q.secs||30,n:t.n,hide:[]};
  save();renderCtrl();
  fx({k:'team',id:t.tid,n:t.n,cat:catLbl(q)});await wait(2700);
  show({s:'play'});fx({k:'showq'});
  BUSY=false;renderCtrl();
  if(Q.autoStart)setTimeout(startClock,2500);
}
function startClock(){const P=Q.play;if(!P.q||P.phase==='reveal')return;
  if(P.phase==='ready'){P.phase='q';save();fx({k:'opts'});}
  resumeClock();}
function resumeClock(){const P=Q.play;stopClock();
  clockT=setInterval(()=>{
    P.secs=Math.max(0,(P.secs||0)-1);
    const c=el('ctlClk');if(c)c.textContent=P.secs;
    fx({k:'clock',secs:P.secs});
    if(P.secs>0)fx({k:'tick',fast:P.secs<=10});
    if(P.secs<=0){stopClock();fx({k:'timeup'});save();renderCtrl();toast('انتهى الوقت — اضغط إجابة الطالب أو «بلا إجابة».',6000);}
  },1000);
  save();renderCtrl();}
function pauseClock(){stopClock();save();renderCtrl();}
function addTime(s){const P=Q.play;P.secs=(P.secs||0)+s;fx({k:'clock',secs:P.secs});save();renderCtrl();}
function fiftyFifty(){const P=Q.play,q=P.q,t=T(P.tid);if(t.l50)return;
  const wrong=[0,1,2,3].filter(i=>i!==q.a);P.hide=shuffle(wrong).slice(0,2);t.l50=true;
  save();sync();fx({k:'half'});renderCtrl();}
async function pickAns(i){
  const P=Q.play;if(!P.q||P.phase==='reveal'||P.phase==='pick')return;
  stopClock();
  if(P.phase==='ready'){P.phase='q';}
  if(i!=null){P.pick=i;P.phase='pick';save();sync();fx({k:'pick',ms:1900});renderCtrl();await wait(2000);}
  else{P.pick=null;}
  const good=i!=null&&i===P.q.a,t=T(P.tid),hf=P.half?.5:1,base=(Q.pts||1)*hf;
  const pts=good?base+((Q.ptsBonus&&P.secs>=(Q.secs||30)/2)?Q.ptsBonus*hf:0):(Q.final?-base:0);
  if(!P.from)t.asked=(t.asked||0)+1;
  if(good){t.right=(t.right||0)+1;}else t.wrong=(t.wrong||0)+1;
  t.score=(t.score||0)+pts;
  Q.last={tid:P.tid,pts,good,from:!!P.from};
  P.phase='reveal';save();
  if(screenLinked())sendScr({t:'state',Q});
  fx({k:'verdict',good,pts});
  renderCtrl();
}
function undoLast(){const L2=Q.last;if(!L2)return;const t=T(L2.tid);
  if(!L2.from)t.asked=Math.max(0,(t.asked||0)-1);
  if(L2.good)t.right=Math.max(0,(t.right||0)-1);else t.wrong=Math.max(0,(t.wrong||0)-1);
  t.score=(t.score||0)-(L2.pts||0);
  Q.last=null;Q.play.phase='q';Q.play.pick=null;save();sync();renderCtrl();toast('أُلغيت النتيجة — اختر الإجابة من جديد.');}
function nextTurn(){stopClock();fx({k:'close'});Q.turn=(Q.turn||0)+1;Q.play={tid:'',q:null,phase:'idle'};save();
  const t=curTurn();renderCtrl();
  if(!t){show({s:'scores'});toast('انتهت كل الأدوار — هذا الترتيب النهائي.',6000);}
  else show({s:'scores'});}
function crown(){const best=ranked(Q.teams.map(t=>t.id))[0];if(!best)return;
  show({s:'champion',id:best.id});setTimeout(()=>fx({k:'champion',id:best.id}),300);}
function groupWinners(){gInit();return gList().map(k=>{const r=ranked(Q.groups[k]||[]);return r[0]?r[0].id:null;}).filter(Boolean);}
async function tieBreak(){
  const r=ranked(Q.teams.map(t=>t.id));if(r.length<2)return;
  const top=r[0].score||0,tied=r.filter(t=>(t.score||0)===top).map(t=>t.id);
  if(tied.length<2){toast('لا يوجد تعادل على الصدارة.');return;}
  modal('<h3>سؤال الحسم</h3><p class="tip">تعادل على الصدارة: '+tied.map(nmc).join(' · ')+'. اختر الفريق الذي يجيب أولًا، وسيُضاف سؤال حسم له.</p>'
    +'<div class="row">'+tied.map(id=>'<button class="btn gold" onclick="closeModal();forceTeam(\''+id+'\');TAB=\'play\';renderCtrl()">'+nmc(id)+'</button>').join('')+'</div>');
}

function nqSubj(){const G0=el('nqG'),L=el('nqL'),C=el('nqC');if(!G0||!L)return;const g=+G0.value||0;
  const opts=g?[...new Set(subjOf(g).concat(SUBJ0[g]||[]))]:CULT;
  L.innerHTML=opts.map(c=>'<option value="'+esc(c)+'">').join('');if(C&&!opts.includes(C.value))C.value=opts[0]||'';}
function hookBank(){nqSubj();const s=el('bfS');if(s)s.oninput=()=>{BF.s=s.value;clearTimeout(hookBank.t);hookBank.t=setTimeout(()=>{renderCtrl();const n=el('bfS');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}},300);};}
function mkQ(g,c,q,o){const ord=shuffle([0,1,2,3]),x={c,q,o:ord.map(i=>o[i]),a:ord.indexOf(0)};if(g)x.g=g;return x;}
function addQ(){const g=+el('nqG').value||0,c=(el('nqC').value||'').trim(),q=(el('nqQ').value||'').trim(),o=[0,1,2,3].map(i=>(el('nqO'+i).value||'').trim());
  if(!c||!q||o.some(x=>!x)){toast('اكتب المادة والسؤال والخيارات الأربعة.');return;}
  if(!g&&!CULT.includes(c)){toast('الفئات الثقافية: ديني، علمي، رياضي.');return;}
  Q.custom=(Q.custom||[]).concat([mkQ(g,c,q,o)]);save();renderCtrl();toast('أُضيف السؤال'+(g?' إلى '+GN[g]+' — '+c:'')+'.');}
function parseG(v){v=normD(v).trim();if(/^[123]$/.test(v))return +v;if(/أول|اول/.test(v))return 1;if(/ثاني/.test(v))return 2;if(/ثالث/.test(v))return 3;return 0;}
function bulkQModal(){modal('<h3>لصق عدة أسئلة</h3><p class="tip">سطر لكل سؤال، والأجزاء مفصولة بـ <b>|</b>:<br>'
  +'<b>للمنهج:</b> المرحلة | المادة | السؤال | الصحيحة | خطأ ١ | خطأ ٢ | خطأ ٣<br>'
  +'<b>للثقافي:</b> الفئة | السؤال | الصحيحة | خطأ ١ | خطأ ٢ | خطأ ٣<br>المرحلة رقم: ١ أو ٢ أو ٣.</p>'
  +'<textarea class="in" id="bq" style="min-height:220px" placeholder="2 | الكيمياء | ما رمز عنصر الصوديوم؟ | Na | S | So | Sd&#10;علمي | كم عدد قارات العالم؟ | سبع | ست | خمس | ثمان"></textarea>'
  +'<div class="row" style="margin-top:12px"><button class="btn primary" onclick="bulkQ()">إضافة</button><button class="btn" onclick="closeModal()">إلغاء</button></div>');}
function bulkQ(){let n=0,bad=0;(el('bq').value||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(l=>{
  const p=l.split('|').map(x=>x.trim());
  if(p.length>=7&&parseG(p[0])&&p[1]&&p.slice(2,7).every(Boolean)){Q.custom.push(mkQ(parseG(p[0]),p[1],p[2],p.slice(3,7)));n++;return;}
  if(p.length>=6&&CULT.includes(p[0])&&p.slice(1,6).every(Boolean)){Q.custom.push(mkQ(0,p[0],p[1],p.slice(2,6)));n++;return;}
  bad++;});
  save();closeModal();renderCtrl();toast('أُضيف '+n+' سؤالًا'+(bad?' — وتُجوهل '+bad+' سطرًا بصيغة غير صحيحة':'')+'.',6000);}
function delQ(i){if(!confirm('حذف هذا السؤال؟'))return;Q.custom.splice(i,1);save();renderCtrl();}
function resetUsed(){if(!confirm('إعادة كل الأسئلة المستخدمة إلى البنك؟'))return;Q.used=[];save();renderCtrl();}
function printBank(){const gsel=BF.g===''?null:+BF.g;
  const L2=allQs().filter(x=>(gsel==null||(x.g||0)===gsel)&&(!BF.c||x.c===BF.c)&&(!BF.s||x.q.includes(BF.s)));
  el('printArea').innerHTML='<h1 style="color:#2B2A6E">'+esc(Q.name)+' — بنك الأسئلة'+(gsel?' — '+GN[gsel]:'')+(BF.c?' — '+esc(BF.c):'')+'</h1>'+L2.map((x,i)=>'<div class="pq"><b>'+(i+1)+'. ['+esc(catLbl(x))+'] '+esc(x.q)+'</b><ol>'
    +x.o.map((o,j)=>'<li'+(j===x.a?' class="ans"':'')+'>'+esc(o)+(j===x.a?' ✓':'')+'</li>').join('')+'</ol></div>').join('');
  setTimeout(()=>window.print(),250);}

/* ---------- sounds + settings ---------- */
const SNDS=[['suspense','التشويق والطبول'],['start','ظهور السؤال'],['good','الإجابة الصحيحة'],['bad','الإجابة الخاطئة'],['win','التتويج']];
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('cq-snd',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function sPut(k,v){const d=await idb();return new Promise(r=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(v,k);t.oncomplete=()=>r();});}
async function sGet(k){const d=await idb();return new Promise(r=>{const t=d.transaction('m','readonly'),q=t.objectStore('m').get(k);q.onsuccess=()=>r(q.result);});}
async function sDel(k){const d=await idb();return new Promise(r=>{const t=d.transaction('m','readwrite');t.objectStore('m').delete(k);t.oncomplete=()=>r();});}
function blobDataURL(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});}
async function setSnd(k,inp){const f=inp.files[0];if(!f)return;await sPut(k,f);SND[k]=URL.createObjectURL(f);
  if(screenLinked())sendScr({t:'snd',k,url:await blobDataURL(f)});renderCtrl();toast('حُفظ الصوت.');}
async function dropSnd(k){await sDel(k);delete SND[k];renderCtrl();}
async function loadSnds(){for(const s of SNDS){try{const b=await sGet(s[0]);if(b)SND[s[0]]=URL.createObjectURL(b);}catch(e){}}}
async function pushSounds(){for(const s of SNDS){try{const b=await sGet(s[0]);if(b)sendScr({t:'snd',k:s[0],url:await blobDataURL(b)});}catch(e){}}}
function testSnd(k){ac();if(k==='suspense')SFX.suspense(2200);else if(k==='win')SFX.win(true);else SFX[k]();}

function resetScores(){if(!confirm('تصفير نقاط كل الفرق والأدوار والأسئلة المستخدمة؟'))return;
  Q.teams.forEach(t=>{t.score=0;t.asked=0;t.right=0;t.wrong=0;t.ll={};});Q.order=[];Q.turn=0;Q.used=[];Q.play={tid:'',q:null,phase:'idle'};
  save();renderCtrl();sync();}
function toggleSandbox(){save();const on=KEY!==DEMO_KEY;KEY=on?DEMO_KEY:REAL_KEY;sessionStorage.setItem('cq-sb',on?'1':'0');
  Q=load(KEY);if(on&&!Q.teams.length)demoTeams(16);save();renderCtrl();sync();toast(on?'وضع التجربة.':'رجعت للمسابقة الحقيقية.');}
function saveFile(){const b=new Blob([JSON.stringify(Q)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='المسابقة-الثقافية-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);toast('حُفظ الملف.');}

/* ---------- modal + keys + boot ---------- */
function modal(h){el('modal').innerHTML=h;el('veil').classList.add('on');}
function closeModal(){el('veil').classList.remove('on');}
document.addEventListener('keydown',e=>{
  if(IS_SCREEN)return;
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='Escape'&&el('stage').classList.contains('on')){exitPresent();return;}
  if(TAB!=='play')return;const P=Q.play||{};
  if(e.key===' '){e.preventDefault();if(P.phase==='ready')startClock();else if(P.phase==='q'){clockT?pauseClock():resumeClock();}}
  if(['1','2','3','4'].includes(e.key)&&P.q)pickAns(+e.key-1);
  if((e.key==='n'||e.key==='N'||e.key==='ى')&&P.phase==='reveal')nextTurn();
});
function askBankPw(){modal('<h3>🔒 رمز فتح بنك الأسئلة</h3><p class="tip">يُطلب مرة واحدة فقط على هذا الجهاز. البنك مشفّر داخل الملف، فلو وصل أحد للرابط ما يقدر يقرأ الأسئلة والإجابات.</p>'
  +'<input class="in" id="bpw" type="password" autocomplete="off" style="direction:ltr;text-align:center" onkeydown="if(event.key===\'Enter\')tryBankPw()">'

  setTimeout(()=>{const i=el('bpw');if(i)i.focus();},50);}
