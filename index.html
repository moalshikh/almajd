  if(f.ll==='vote'){ovShow('<div class="rays"></div><div class="llBig pulse">📊</div><div class="nm" style="font-size:clamp(28px,10vh,140px)">تصويت الجمهور</div><div class="to">ارفعوا أيديكم للإجابة التي تختارونها</div>','',0,'play');SFX.reveal();return;}
  if(f.ll==='voteRes'){const P=Q.play,q=P.q,tot=f.v.reduce((a,b)=>a+b,0)||1;
    ovShow('<div class="lbl">📊 تصويت الجمهور</div><div class="vBars">'+q.o.map((o,i)=>{const pc=Math.round(f.v[i]/tot*100);
      return '<div class="vB'+(i===f.top?' top':'')+((P.hide||[]).includes(i)?' dim':'')+'"><div class="vP">'+pc+'%</div><div class="vCol"><i data-h="'+pc+'"></i></div><div class="vK">'+KEYS[i]+'</div><div class="vT">'+esc(o)+'</div></div>';}).join('')+'</div>','',0,'play');
    setTimeout(()=>document.querySelectorAll('.vCol i').forEach(x=>x.style.height=x.dataset.h+'%'),80);SFX.suspense(1500);setTimeout(()=>SFX.reveal(),1500);return;}
}

/* ===================== KNOCKOUT BRACKET (المباريات) ===================== */
const STN=['الدور الأول','ربع النهائي','نصف النهائي','الدور قبل النهائي','النهائي'];
function brInit(){if(!Q.br)Q.br={st:[],champ:null};if(Q.finalFrom==null)Q.finalFrom=2;if(Q.llPerMatch==null)Q.llPerMatch=true;}
function stName(i){const st=Q.br.st[i];if(st&&st.teams&&st.teams.length===2)return 'النهائي';
  if(!st){const proj=brProjection();const p=proj[i];if(p&&p.k===2)return 'النهائي';}
  return STN[i]||('الدور '+(i+1));}
function matchNo(si,mi){let n=0;for(let i=0;i<si;i++)n+=Q.br.st[i].m.length;return n+mi+1;}
const curM=()=>Q.mid?((Q.br.st[Q.mid.s]||{}).m||[])[Q.mid.m]:null;
function stageDone(st){return st&&st.m.length>0&&st.m.every(m=>m.w);}
/* projected stage sizes (for empty columns) */
function brProjection(){const out=[];const S=Q.br.st;
  let k;if(!S.length){k=Q.teams.length;}else{const last=S[S.length-1];k=last.m.length+(last.byes||[]).length;}
  let i=S.length,carry=S.length?((S[S.length-1].byes||[]).length>0):false;
  while(k>1&&i<8){const mm=Math.floor(k/2),by=k%2;out[i]={k,m:mm,b:by};k=mm+by;i++;}
  if(k===1)out[i]={k:1,champ:true};
  return out;}

/* ---------- draw stage 0 (inside groups) ---------- */
let BRBUSY=false;
async function drawMatches(fast){
  brInit();gInit();
  if(!placed().size){toast('اعمل قرعة المجموعات أولًا من تبويب «القرعة».',6000);return;}
  if(remaining().length){toast('باقي فرق ما دخلت المجموعات — كمّل قرعة المجموعات.',6000);return;}
  if(Q.br.st.length&&!confirm('إعادة قرعة المواجهات من البداية؟ تُمسح نتائج المباريات.'))return;
  BRBUSY=true;const st={teams:Q.teams.map(t=>t.id),byes:[],m:[],grp:true};Q.br={st:[st],champ:null};Q.mid=null;save();
  show({s:'bracket'});renderCtrl();if(!fast)await wait(900);
  for(const k of gList()){
    let L=shuffle(Q.groups[k]||[]);
    if(L.length%2){const bye=L[Math.floor(Math.random()*L.length)];
      if(!fast){fx({k:'roulette',ids:L,win:bye,title:'المجموعة '+k+' — قرعة التأهل المباشر',sub:'يتأهل مباشرة إلى '+STN[1],ms:4200,hold:3200});await wait(8200);}
      st.byes.push({id:bye,g:k});L=L.filter(x=>x!==bye);save();show({s:'bracket',hl:bye});}
    for(let j=0;j+1<L.length;j+=2){
      st.m.push({a:L[j],b:L[j+1],g:k,sa:0,sb:0,w:null});save();
      if(!fast){fx({k:'mdraw',a:L[j],b:L[j+1],title:'المجموعة '+k+' · المباراة '+st.m.length});await wait(3400);}
      show({s:'bracket',hl:L[j+1]});if(!fast)await wait(500);
    }
  }
  BRBUSY=false;save();renderCtrl();show({s:'bracket'});toast('اكتملت قرعة المواجهات — '+st.m.length+' مباراة في '+STN[0]+'.',6000);
}
/* ---------- build next stage ---------- */
async function nextStage(fast){
  brInit();const S=Q.br.st,i=S.length-1,st=S[i];
  if(!stageDone(st)){toast('باقي مباريات ما انتهت في '+stName(i)+'.');return;}
  let teams=[];
  if(st.grp){const per=gList().map(k=>st.m.filter(m=>m.g===k).map(m=>m.w).concat(st.byes.filter(b=>b.g===k).map(b=>b.id)));
    const mx=Math.max(0,...per.map(l=>l.length));for(let j=0;j<mx;j++)per.forEach(l=>{if(l[j])teams.push(l[j]);});}
  else teams=st.m.map(m=>m.w).concat((st.byes||[]).map(b=>b.id));
  if(teams.length===1){Q.br.champ=teams[0];save();crown2(teams[0]);return;}
  BRBUSY=true;const ns={teams,byes:[],m:[]};S.push(ns);let pool=teams.slice();save();
  show({s:'bracket'});renderCtrl();if(!fast)await wait(800);
  if(pool.length%2){
    const prev=(st.byes||[]).map(b=>b.id).find(id=>pool.includes(id));
    const bye=prev||pool[Math.floor(Math.random()*pool.length)];
    const nxt=STN[S.length]||'الدور التالي',toFinal=Math.ceil(pool.length/2)===2;
    if(!fast){
      if(prev){fx({k:'reveal',id:bye,label:'تأهل مباشر',to:'ينتظر في '+(toFinal?'النهائي':nxt),ms:3200});await wait(3600);}
      else{fx({k:'roulette',ids:pool,win:bye,title:'قرعة التأهل المباشر — '+stName(S.length-1),sub:'يتأهل مباشرة إلى '+(toFinal?'النهائي':nxt),ms:4600,hold:3400});await wait(9000);}
    }
    ns.byes.push({id:bye});pool=pool.filter(x=>x!==bye);save();
  }
  for(let j=0;j+1<pool.length;j+=2){ns.m.push({a:pool[j],b:pool[j+1],sa:0,sb:0,w:null});save();
    if(!fast){fx({k:'mdraw',a:pool[j],b:pool[j+1],title:stName(S.length-1)+' · المباراة '+matchNo(S.length-1,ns.m.length-1)});await wait(3400);}
    show({s:'bracket'});}
  BRBUSY=false;save();renderCtrl();show({s:'bracket'});
}
/* ---------- matches ---------- */
function startMatch(si,mi){brInit();const m=Q.br.st[si].m[mi];if(!m||m.w)return;
  if(Q.mid&&curM()&&!curM().w&&!(Q.mid.s===si&&Q.mid.m===mi)&&!confirm('فيه مباراة شغّالة — تبدأ هذه بدلها؟'))return;
  stopClock();Q.mid={s:si,m:mi};m.sa=m.sa||0;m.sb=m.sb||0;
  if(Q.llPerMatch){T(m.a).ll={};T(m.b).ll={};}
  Q.final=si>=Q.finalFrom&&Q.finalFrom<99;
  const first=Math.random()<.5?m.a:m.b,second=first===m.a?m.b:m.a,per=Q.perTeam||3;
  Q.order=[];for(let r=1;r<=per;r++)Q.order.push({tid:first,n:r},{tid:second,n:r});Q.turn=0;
  Q.play={tid:'',q:null,phase:'idle'};save();
  show({s:'match'});fx({k:'vs',a:m.a,b:m.b,first,title:stName(si)+' · المباراة '+matchNo(si,mi),fin:Q.final});
  TAB='play';renderCtrl();
}
function addTieBreak(){const m=curM();if(!m)return;const n=(Q.order.filter(o=>o.tid===m.a).length)+1;
  Q.order.push({tid:m.a,n,tb:1},{tid:m.b,n,tb:1});save();renderCtrl();
  fx({k:'reveal',id:m.a,label:'⚖️ سؤال حسم',to:'سؤال لكل فريق — الأعلى يتأهل',ms:2600});toast('أُضيف سؤال حسم لكل فريق.');}
function endMatch(w,why){const m=curM();if(!m)return;
  if(!w){if(m.sa===m.sb){toast('تعادل '+m.sa+' : '+m.sb+' — أضف «سؤال حسم» أو حدّد الفائز يدويًا.',7000);return;}w=m.sa>m.sb?m.a:m.b;}
  stopClock();const si=Q.mid.s;m.w=w;m.why=why||'';Q.mid=null;Q.final=false;Q.play={tid:'',q:null,phase:'idle'};Q.order=[];save();
  const st=Q.br.st[si],last=st.teams.length===2;
  if(last){Q.br.champ=w;save();renderCtrl();crown2(w);return;}
  fx({k:'qual',id:w,to:'يتأهل إلى '+(stageDone(st)?stName(si+1)||'الدور التالي':stName(si+1)||'الدور التالي'),why:why||''});
  setTimeout(()=>show({s:'bracket',hl:w}),5200);renderCtrl();
  if(stageDone(st))toast('اكتمل '+stName(si)+' ✓ — من تبويب «المباريات» اضغط «تجهيز الدور التالي».',8000);
}
function crown2(id){show({s:'champion',id});setTimeout(()=>fx({k:'champion',id}),300);renderCtrl();}
function manualWin(si,mi){const m=Q.br.st[si].m[mi];
  modal('<h3>تحديد الفائز يدويًا</h3><p class="tip">مثلًا عند غياب فريق (يُعدّ خاسرًا) أو قرار لجنة التحكيم.</p>'
    +'<div class="row">'+[m.a,m.b].map(id=>'<button class="btn gold" onclick="closeModal();Q.mid={s:'+si+',m:'+mi+'};endMatch(\''+id+'\',el(\'mwWhy\').value)">'+nmc(id)+' يتأهل</button>').join('')+'</div>'
    +'<div class="tip" style="margin-top:10px">السبب (اختياري)</div><select class="in" id="mwWhy"><option value="">—</option><option>غياب الفريق المنافس</option><option>قرار لجنة التحكيم</option><option>انسحاب</option></select>'
    +'<div class="row" style="margin-top:12px"><button class="btn" onclick="closeModal()">إلغاء</button></div>');}
function undoWin(si,mi){const m=Q.br.st[si].m[mi];if(Q.br.st.length>si+1){toast('بدأ الدور التالي — أعد بناءه أولًا («إلغاء آخر دور»).',6000);return;}
  if(!confirm('إلغاء نتيجة هذه المباراة؟'))return;m.w=null;Q.br.champ=null;save();renderCtrl();sync();}
function dropLastStage(){if(Q.br.st.length<2)return;if(!confirm('حذف آخر دور ('+stName(Q.br.st.length-1)+') وإعادة تجهيزه؟'))return;
  Q.br.st.pop();Q.br.champ=null;Q.mid=null;save();renderCtrl();show({s:'bracket'});}

/* match score bookkeeping — called from pickAns / undo */
function brScore(tid,pts){const m=curM();if(!m||!pts)return;if(tid===m.a)m.sa=(m.sa||0)+pts;else if(tid===m.b)m.sb=(m.sb||0)+pts;}

/* ---------- control tab ---------- */
function tabMatches(){brInit();const S=Q.br.st,m0=curM();
  let h='<h2>المباريات — خروج المغلوب</h2><div class="sub">كل مباراة بين فريقين، كل فريق '+(Q.perTeam||3)+' أسئلة بالتناوب، والأعلى نقاطًا يتأهل. عند التعادل «سؤال حسم».</div>';
  if(!S.length){h+='<div class="card"><h3>١) قرعة المجموعات</h3><p class="tip">من تبويب «القرعة» وزّع الفرق على مجموعتين (A و B).</p>'
      +'<button class="btn" onclick="TAB=\'draw\';renderCtrl()">الذهاب للقرعة</button></div>'
      +'<div class="card"><h3>٢) قرعة المواجهات 🎲</h3><p class="tip">تُسحب المواجهات داخل كل مجموعة أمام الجميع، والمجموعة الفردية يتأهل منها فريق بالقرعة مباشرة إلى ربع النهائي.</p>'
      +'<div class="row"><button class="btn gold lg" onclick="drawMatches()"'+(BRBUSY?' disabled':'')+'>🎲 قرعة المواجهات الحماسية</button><button class="btn sm" onclick="drawMatches(true)">قرعة سريعة بدون عرض</button></div></div>';
    return h;}
  h+='<div class="card"><div class="row"><button class="btn gold" onclick="show({s:\'bracket\'})">📺 عرض شجرة البطولة</button>'
    +(m0?'<button class="btn primary" onclick="TAB=\'play\';renderCtrl()">⚔ المباراة الجارية</button>':'')
    +(stageDone(S[S.length-1])&&!Q.br.champ?'<button class="btn gold" onclick="nextStage()"'+(BRBUSY?' disabled':'')+'>➡ تجهيز '+esc(brNextName())+'</button><button class="btn sm" onclick="nextStage(true)">بدون عرض</button>':'')
    +(S.length>1?'<button class="btn sm" onclick="dropLastStage()">إلغاء آخر دور</button>':'')
    +'<button class="btn sm danger" onclick="drawMatches()">إعادة قرعة المواجهات</button></div>'
    +'<div class="row" style="margin-top:10px"><label class="row tip"><input type="checkbox" '+(Q.llPerMatch?'checked':'')+' onchange="Q.llPerMatch=this.checked;save()"> تتجدد وسائل المساعدة في كل مباراة</label>'
    +'<label class="row tip">🔥 خصم الإجابة الخاطئة من: <select class="in" style="width:auto;padding:5px 8px" onchange="Q.finalFrom=+this.value;save()">'
    +[[1,STN[1]],[2,STN[2]],[3,STN[3]],[4,'النهائي فقط'],[99,'بدون خصم']].map(o=>'<option value="'+o[0]+'"'+(Q.finalFrom===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label></div></div>';
  S.forEach((st,si)=>{
    h+='<div class="card"><h3>'+esc(stName(si))+' <span class="tip">'+st.m.filter(m=>m.w).length+' / '+st.m.length+'</span></h3>';
    (st.byes||[]).forEach(b=>{h+='<div class="mRow bye">'+shield(b.id,'26px')+'<b>'+nmc(b.id)+'</b><span class="tip">تأهل مباشر'+(b.g?' — المجموعة '+b.g:'')+'</span></div>';});
    st.m.forEach((m,mi)=>{const live=Q.mid&&Q.mid.s===si&&Q.mid.m===mi;
      h+='<div class="mRow'+(live?' live':'')+(m.w?' done':'')+'"><span class="mNo">'+matchNo(si,mi)+'</span>'
        +'<span class="mT'+(m.w===m.a?' w':m.w?' l':'')+'">'+shield(m.a,'24px')+nmc(m.a)+'</span><b class="mS">'+(m.sa||0)+' : '+(m.sb||0)+'</b>'
        +'<span class="mT'+(m.w===m.b?' w':m.w?' l':'')+'">'+shield(m.b,'24px')+nmc(m.b)+'</span>'+(m.g?'<span class="gTag">'+m.g+'</span>':'')
        +'<span class="row" style="gap:4px;margin-inline-start:auto">'
        +(m.w?(m.why?'<span class="tip">'+esc(m.why)+'</span>':'')+'<button class="btn sm" onclick="undoWin('+si+','+mi+')">↺</button>'
          :(live?'<span class="tip" style="color:var(--gold)">● جارية</span>':'<button class="btn sm primary" onclick="startMatch('+si+','+mi+')">▶ ابدأ</button>')
           +'<button class="btn sm" onclick="manualWin('+si+','+mi+')">تحديد الفائز</button>')+'</span></div>';});
    h+='</div>';});
  if(Q.br.champ)h+='<div class="card" style="text-align:center"><h3 style="justify-content:center">🏆 البطل: '+nmc(Q.br.champ)+'</h3><button class="btn gold" onclick="crown2(Q.br.champ)">إعادة التتويج على الشاشة</button></div>';
  return h;}
function brNextName(){const S=Q.br.st,st=S[S.length-1];const k=st.m.length+(st.byes||[]).length;if(k===1)return 'التتويج';if(k===2)return 'النهائي';return STN[S.length]||'الدور التالي';}
/* match card shown at top of the play tab */
function matchCard(){const m=curM();if(!m)return '';const si=Q.mid.s,mi=Q.mid.m,left=Q.order.length-Q.turn;
  return '<div class="card" style="border-color:var(--gold)"><div class="row" style="justify-content:space-between"><b>⚔ '+esc(stName(si))+' · المباراة '+matchNo(si,mi)+(Q.final?' · 🔥 خصم عند الخطأ':'')+'</b>'
    +'<span class="tip">متبقٍ '+Math.max(0,left)+' دور</span></div>'
    +'<div class="vsCtl"><span>'+shield(m.a,'30px')+nmc(m.a)+'</span><b>'+(m.sa||0)+' : '+(m.sb||0)+'</b><span>'+nmc(m.b)+shield(m.b,'30px')+'</span></div>'
    +'<div class="row"><button class="btn sm" onclick="show({s:\'match\'})">📺 لوحة النتيجة</button><button class="btn sm" onclick="addTieBreak()">⚖️ سؤال حسم</button>'
    +'<button class="btn sm gold" onclick="endMatch()">🏁 إنهاء وإعلان الفائز</button><button class="btn sm" onclick="manualWin('+si+','+mi+')">تحديد الفائز يدويًا</button></div></div>';}

/* ---------- screen scenes ---------- */
function scMatch(){const m=curM();
  if(!m)return scBracket({});
  const si=Q.mid.s,lead=m.sa===m.sb?'':(m.sa>m.sb?m.a:m.b);
  const side=(id,sc)=>'<div class="vsSide'+(lead===id?' lead':'')+'">'+shield(id,'22vh')+'<div class="vsN">'+nm(id)+clsTag(id)+'</div><div class="vsSc">'+sc+'</div></div>';
  return '<div class="vsWrap"><div class="vsT">'+esc(stName(si))+' · المباراة '+matchNo(si,Q.mid.m)+(Q.final?' · <span style="color:#FF9DA0">🔥 خصم عند الخطأ</span>':'')+'</div>'
    +'<div class="vsRow">'+side(m.a,m.sa||0)+'<div class="vsX">VS</div>'+side(m.b,m.sb||0)+'</div></div>';}
function scBracket(v){brInit();const S=Q.br.st,proj=brProjection(),cols=[];
  const card=(m,si,mi)=>{const live=Q.mid&&Q.mid.s===si&&Q.mid.m===mi;
    const row=(id,sc,w)=>'<div class="bT'+(m.w?(w?' w':' l'):'')+(v.hl===id?' hl':'')+'">'+shield(id,'3.2vh')+'<span>'+sh(id)+'</span><b>'+(m.w||live||(m.sa||m.sb)?sc:'')+'</b></div>';
    return '<div class="bM'+(live?' live':'')+'"><i class="bNo">'+matchNo(si,mi)+'</i>'+row(m.a,m.sa||0,m.w===m.a)+row(m.b,m.sb||0,m.w===m.b)+'</div>';};
  S.forEach((st,si)=>{cols.push('<div class="bCol"><div class="bH">'+esc(stName(si))+'</div><div class="bList">'
    +st.m.map((m,mi)=>card(m,si,mi)).join('')
    +(st.byes||[]).map(b=>'<div class="bM bye'+(v.hl===b.id?' hl':'')+'"><div class="bT">'+shield(b.id,'3.2vh')+'<span>'+sh(b.id)+'</span></div><div class="bBye">⭐ تأهل مباشر</div></div>').join('')+'</div></div>');});
  proj.forEach((p,i)=>{if(!p||i<S.length)return;
    if(p.champ){cols.push('<div class="bCol champ"><div class="bH">البطل</div><div class="bList"><div class="bM champ">'+(Q.br.champ?shield(Q.br.champ,'7vh')+'<span>'+sh(Q.br.champ)+'</span>':'🏆')+'</div></div></div>');return;}
    const nmx=p.k===2?'النهائي':(STN[i]||'الدور '+(i+1));
    cols.push('<div class="bCol"><div class="bH">'+nmx+'</div><div class="bList">'+Array.from({length:p.m},()=>'<div class="bM empty"><div class="bT">؟</div><div class="bT">؟</div></div>').join('')
      +(p.b?'<div class="bM bye empty"><div class="bT">؟</div><div class="bBye">⭐ تأهل مباشر</div></div>':'')+'</div></div>');});
  if(Q.br.champ&&!proj.some(p=>p&&p.champ))cols.push('<div class="bCol champ"><div class="bH">البطل</div><div class="bList"><div class="bM champ">'+shield(Q.br.champ,'7vh')+'<span>'+sh(Q.br.champ)+'</span></div></div></div>');
  if(!S.length)return '<div class="idle"><div class="st">شجرة البطولة — بانتظار قرعة المواجهات</div></div>';
  return '<div class="bWrap">'+cols.join('')+'</div>';}

/* ---------- screen effects ---------- */
function brFX(f){
  if(f.k==='mdraw'||f.k==='vs'){
    ovShow('<div class="rays"></div><div class="lbl">'+esc(f.title||'')+'</div><div class="vsRow fx"><div class="vsSide s1">'+shield(f.a,'20vh')+'<div class="vsN">'+nm(f.a)+clsTag(f.a)+'</div></div>'
      +'<div class="vsX s3">VS</div><div class="vsSide s2">'+shield(f.b,'20vh')+'<div class="vsN">'+nm(f.b)+clsTag(f.b)+'</div></div></div>'
      +(f.k==='vs'?'<div class="to s4">🎲 يبدأ: '+nm(f.first)+(f.fin?' · 🔥 خصم عند الخطأ':'')+'</div>':''),'',f.k==='vs'?5200:3100);
    SFX.reveal();setTimeout(()=>SFX.reveal(),700);setTimeout(()=>{SFX.suspense(900);},1100);if(f.k==='vs')setTimeout(()=>SFX.start(),2600);
    return true;}
  if(f.k==='qual'){const t=T(f.id);
    ovShow('<div class="rays"></div><div class="lbl">'+(f.why?esc(f.why):'🏁 نهاية المباراة')+'</div><div class="slam">'+shield(f.id,'22vh')+'</div>'
      +'<div class="nm slam" style="color:var(--gold)">'+esc(t.name)+clsTag(f.id)+'</div><div class="to">'+esc(f.to)+'</div>','',5000);
    SFX.win(false);confetti(5000);return true;}
  return false;}

</script>
