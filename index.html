/* ===================== LIFELINES · RULES · FINAL ROUNDS ===================== */
const LL=[['fifty','✂️','حذف إجابتين','تُحذف إجابتان خاطئتان'],
  ['pass','↪️','تحويل السؤال','يُحوَّل السؤال للفريق التالي أو لفريق يختاره'],
  ['call','📞','اتصال بمعلم','اتصال بالمعلم الذي سجّله الفريق مسبقًا'],
  ['friend','🙋','زميل من الجمهور','يستعين الفريق بزميل من الجمهور'],
  ['vote','📊','تصويت الجمهور','يصوّت الجمهور ويُعتمد الخيار الأعلى'],
  ['swap','🔄','استبدال السؤال','سؤال جديد من نفس الفئة بنصف النقاط']];
const LLD={};LL.forEach(x=>LLD[x[0]]={ic:x[1],nm:x[2],ds:x[3]});
const RULES0=['يتكوّن كل فريق من خمسة طلاب من الفصل نفسه.',
  'يختار كل فريق ناطقًا واحدًا، ولا تُعتمد إلا الإجابة التي يعلنها الناطق.',
  'لكل سؤال أربعة خيارات، ومدة الإجابة {secs} ثانية.',
  'لكل فريق {ll} وسائل مساعدة كحد أقصى، وكل وسيلة تُستخدم مرة واحدة فقط.',
  'الاتصال بمعلم: يسجّل الفريق مسبقًا اسم المعلم ورقم جواله، ومدة المكالمة {call} ثانية.',
  'استبدال السؤال يكون من الفئة نفسها، ويُحتسب بنصف النقاط.',
  'عند تحويل السؤال لا يحصل الفريق المحوِّل على نقاط، وتُحتسب النقاط للفريق الذي يجيب.',
  'في الجولات النهائية تُخصم درجة السؤال عند الإجابة الخاطئة.',
  'الفريق الذي لا يحضر في موعده يُعدّ خاسرًا.',
  'التشجيع مسموح، والتشويش على الفرق الأخرى ممنوع.',
  'قرار لجنة التحكيم نهائي.'];
function llInit(){
  if(Q.llMax==null)Q.llMax=3;if(!Q.llOn)Q.llOn={};LL.forEach(x=>{if(Q.llOn[x[0]]==null)Q.llOn[x[0]]=true;});
  if(Q.callSecs==null)Q.callSecs=30;if(Q.friendSecs==null)Q.friendSecs=20;if(!Q.rules)Q.rules=RULES0.slice();
  Q.teams.forEach(t=>{if(!t.ll)t.ll={};if(t.l50){t.ll.fifty=1;delete t.l50;}});
}
const ruleTxt=r=>String(r).replace('{secs}',Q.secs||30).replace('{ll}',Q.llMax).replace('{call}',Q.callSecs||30).replace('{friend}',Q.friendSecs||20);
function llUsed(id){const t=T(id);return Object.keys(t.ll||{}).filter(k=>t.ll[k]).length;}
function llLeft(id){return Math.max(0,(Q.llMax||0)-llUsed(id));}
function llCan(id,k){const t=T(id);return Q.llOn[k]!==false&&!(t.ll||{})[k]&&llLeft(id)>0;}
function llMark(id,k){const t=T(id);t.ll=t.ll||{};t.ll[k]=1;}
const llActive=()=>LL.filter(x=>Q.llOn[x[0]]!==false);

/* ---- control bar during a question ---- */
function llBar(){
  const P=Q.play||{};if(!P.q||!(P.phase==='q'||P.phase==='ready'))return '';
  const id=P.tid;
  return '<div class="card" style="padding:12px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>🛟 وسائل المساعدة</b>'
    +'<span class="tip">متبقٍ لـ'+nm(id)+': <b style="color:var(--gold)">'+llLeft(id)+'</b> من '+Q.llMax+'</span></div><div class="row">'
    +llActive().map(x=>{const used=(T(id).ll||{})[x[0]],can=llCan(id,x[0]);
      return '<button class="btn sm'+(can?'':' off')+'" '+(can?'onclick="useLL(\''+x[0]+'\')"':'disabled')+' title="'+esc(x[3])+'">'+x[1]+' '+x[2]+(used?' ✓':'')+'</button>';}).join('')
    +'</div>'+(P.half?'<p class="tip" style="margin-top:6px">🔄 هذا سؤال مستبدل — يُحتسب بنصف النقاط.</p>':'')
    +(P.from?'<p class="tip" style="margin-top:6px">↪️ محوّل من '+nm(P.from)+' — النقاط لـ'+nm(id)+'.</p>':'')+'</div>';
}
function useLL(k){const P=Q.play;if(!P.q||!llCan(P.tid,k))return;
  ({fifty:llFifty,pass:llPassModal,call:llCall,friend:llFriend,vote:llVoteModal,swap:llSwap})[k]();}
function llFifty(){const P=Q.play,q=P.q;llMark(P.tid,'fifty');
  const wrong=[0,1,2,3].filter(i=>i!==q.a);P.hide=shuffle(wrong).slice(0,2);
  save();sync();fx({k:'llfx',ll:'fifty',id:P.tid});setTimeout(()=>fx({k:'half'}),1600);renderCtrl();}
function fiftyFifty(){useLL('fifty');}

/* pass */
function llPassModal(){const P=Q.play,ids=teamsInPlay().filter(x=>x!==P.tid);
  const nxt=(Q.order||[]).slice((Q.turn||0)+1).map(o=>o.tid).find(x=>x!==P.tid)||ids[0];
  modal('<h3>↪️ تحويل السؤال</h3><p class="tip">الفريق '+nm(P.tid)+' يحوّل السؤال. النقاط تُحتسب للفريق الذي يجيب.</p>'
    +(nxt?'<button class="btn gold" style="margin:8px 0" onclick="llPass(\''+nxt+'\')">للفريق التالي: '+nmc(nxt)+'</button>':'')
    +'<div class="tip" style="margin:8px 0 6px">أو اختر فريقًا:</div><div class="row">'+ids.map(id=>'<button class="btn sm" onclick="llPass(\''+id+'\')">'+nmc(id)+'</button>').join('')+'</div>'
    +'<div class="row" style="margin-top:12px"><button class="btn" onclick="closeModal()">إلغاء</button></div>');}
function llPass(to){closeModal();const P=Q.play,from=P.tid;stopClock();llMark(from,'pass');
  const f=T(from);f.asked=(f.asked||0)+1;
  P.from=from;P.tid=to;P.secs=Q.secs||30;P.pick=null;
  save();fx({k:'llfx',ll:'pass',id:from,to});
  setTimeout(()=>{sync();renderCtrl();if(P.phase==='q')resumeClock();},2800);renderCtrl();}

/* call teacher / friend (timed) */
let llT=null;
function llTimed(k,secs,extra){const P=Q.play;stopClock();llMark(P.tid,k);save();
  const t=T(P.tid);let left=secs;
  fx({k:'llfx',ll:k,id:P.tid,secs,teacher:extra||''});
  const body=()=>'<h3>'+LLD[k].ic+' '+LLD[k].nm+'</h3>'
    +(k==='call'?(t.teacher||t.phone?'<div class="card" style="text-align:center"><div style="font-size:20px;font-weight:800">'+esc(t.teacher||'المعلم')+'</div>'
      +(t.phone?'<a class="btn gold" style="margin-top:10px;font-size:20px;direction:ltr" href="tel:'+esc(t.phone)+'">📞 '+esc(t.phone)+'</a>':'')+'</div>'
      :'<p class="tip" style="color:#FFB4A8">لم يسجّل هذا الفريق معلمًا. أضفه من تبويب الفرق ← 👥.</p>'):'<p class="tip">يختار الفريق زميلًا من الجمهور ليساعده.</p>')
    +'<div style="text-align:center;font-size:44px;font-weight:800;color:var(--accent)" id="llClk">'+left+'</div>'
    +'<div class="row"><button class="btn primary" onclick="llEnd()">انتهت — العودة للسؤال</button><button class="btn sm" onclick="llAdd(15)">+١٥ ثانية</button></div>';
  modal(body());
  clearInterval(llT);llT=setInterval(()=>{left--;const c=el('llClk');if(c)c.textContent=Math.max(0,left);fx({k:'llclock',secs:Math.max(0,left)});
    if(left<=0){clearInterval(llT);llT=null;toast('انتهى وقت '+LLD[k].nm+'.');}},1000);
  llAdd=s=>{left+=s;};
  renderCtrl();}
let llAdd=()=>{};
function llEnd(){clearInterval(llT);llT=null;closeModal();fx({k:'llend'});const P=Q.play;if(P.phase==='q')setTimeout(resumeClock,400);renderCtrl();}
function llCall(){const t=T(Q.play.tid);llTimed('call',Q.callSecs||30,t.teacher||'');}
function llFriend(){llTimed('friend',Q.friendSecs||20);}

/* audience vote */
let VOTE=[0,0,0,0];
function llVoteModal(){const P=Q.play,q=P.q;stopClock();VOTE=[0,0,0,0];
  llMark(P.tid,'vote');save();fx({k:'llfx',ll:'vote',id:P.tid,persist:1});renderCtrl();
  const hid=P.hide||[];
  modal('<h3>📊 تصويت الجمهور</h3><p class="tip">اطلب من الجمهور رفع الأيدي لكل خيار، واكتب العدد (أو تقديرًا).</p>'
    +q.o.map((o,i)=>hid.includes(i)?'':'<div class="row" style="margin:6px 0"><b style="min-width:26px">'+KEYS[i]+'</b><span style="flex:1">'+esc(o)+(i===q.a?' <span class="tip" style="color:#6BE0A4">(الصحيحة)</span>':'')+'</span>'
      +'<button class="btn sm" onclick="vAdj('+i+',-1)">−</button><input class="in" id="vv'+i+'" type="number" min="0" value="0" style="width:80px;text-align:center" oninput="VOTE['+i+']=Math.max(0,+this.value||0)">'
      +'<button class="btn sm" onclick="vAdj('+i+',1)">+</button></div>').join('')
    +'<div class="row" style="margin-top:12px"><button class="btn gold" onclick="llVoteShow()">عرض النتيجة على الشاشة</button><button class="btn" onclick="llEnd()">إلغاء</button></div>');}
function vAdj(i,d){VOTE[i]=Math.max(0,(VOTE[i]||0)+d);const e=el('vv'+i);if(e)e.value=VOTE[i];}
function llVoteShow(){const P=Q.play,hid=P.hide||[];const v=VOTE.map((x,i)=>hid.includes(i)?0:x);
  const tot=v.reduce((a,b)=>a+b,0);if(!tot){toast('اكتب أعداد التصويت أولًا.');return;}
  const top=v.indexOf(Math.max(...v));P.vote=v;save();fx({k:'llfx',ll:'voteRes',id:P.tid,v,top});
  modal('<h3>📊 النتيجة على الشاشة</h3><p class="tip">الأعلى: <b>'+KEYS[top]+' — '+esc(P.q.o[top])+'</b> ('+Math.round(v[top]/tot*100)+'%)</p>'
    +'<div class="row" style="margin-top:12px"><button class="btn gold" onclick="closeModal();fx({k:\'llend\'});setTimeout(()=>pickAns('+top+'),500)">اعتماد اختيار الجمهور ('+KEYS[top]+')</button>'
    +'<button class="btn" onclick="llEnd()">يقرّر الفريق بنفسه</button></div>');}

/* swap question */
function llSwap(){const P=Q.play,q=P.q;
  const all=allQs(),used=new Set(Q.used||[]);used.add(q.i);
  const pool=all.filter(x=>x.c===q.c&&(x.g||0)===(q.g||0)&&!used.has(x.i));
  if(!pool.length){toast('لا يوجد سؤال آخر متبقٍ في '+q.c+'.');return;}
  stopClock();llMark(P.tid,'swap');
  const nq=pool[Math.floor(Math.random()*pool.length)];Q.used=(Q.used||[]).concat([nq.i]);
  const ord=shuffle([0,1,2,3]);
  P.q={c:nq.c,g:nq.g||0,q:nq.q,o:ord.map(k=>nq.o[k]),a:ord.indexOf(nq.a),i:nq.i};P.hide=[];P.pick=null;P.half=true;P.secs=Q.secs||30;P.phase='ready';
  save();fx({k:'llfx',ll:'swap',id:P.tid});
  setTimeout(()=>{show({s:'play'});fx({k:'showq'});renderCtrl();if(Q.autoStart)setTimeout(startClock,2000);},2600);renderCtrl();}

/* ---- final rounds ---- */
function toggleFinal(){Q.final=!Q.final;save();renderCtrl();
  if(Q.final)fx({k:'llfx',ll:'final'});toast(Q.final?'🔥 الجولات النهائية: الإجابة الخاطئة تخصم درجة السؤال.':'رجعنا للجولات العادية.');}
function resetLL(){if(!confirm('إعادة وسائل المساعدة لكل الفرق؟'))return;Q.teams.forEach(t=>t.ll={});save();renderCtrl();sync();toast('أُعيدت وسائل المساعدة.');}

/* ---- team details (members, speaker, teacher) ---- */
function teamModal(i){const t=Q.teams[i];
  modal('<h3>👥 '+esc(t.name)+'</h3>'
    +'<div class="tip">أعضاء الفريق (اسم في كل سطر)</div><textarea class="in" id="tmM" style="min-height:120px">'+esc(t.members||'')+'</textarea>'
    +'<div class="grid2" style="margin-top:8px"><div><div class="tip">الناطق باسم الفريق</div><input class="in" id="tmS" value="'+esc(t.speaker||'')+'"></div><div></div>'
    +'<div><div class="tip">📞 المعلم المستعان به</div><input class="in" id="tmT" value="'+esc(t.teacher||'')+'"></div>'
    +'<div><div class="tip">رقم جوال المعلم</div><input class="in" id="tmP" value="'+esc(t.phone||'')+'" inputmode="tel" style="direction:ltr;text-align:right"></div></div>'
    +'<p class="tip">رقم الجوال يظهر في لوحة التحكم فقط — لا يظهر على الشاشة.</p>'
    +'<div class="row" style="margin-top:12px"><button class="btn primary" onclick="teamSave('+i+')">حفظ</button><button class="btn" onclick="closeModal()">إلغاء</button></div>');}
function teamSave(i){const t=Q.teams[i];t.members=el('tmM').value.trim();t.speaker=el('tmS').value.trim();t.teacher=el('tmT').value.trim();t.phone=el('tmP').value.trim();
  save();closeModal();renderCtrl();toast('حُفظت بيانات الفريق.');}

/* ---- rules tab ---- */
function tabRules(){
  return '<h2>القوانين ووسائل المساعدة</h2><div class="sub">عدّل القوانين كما تريد — {secs} و{ll} و{call} تُستبدل تلقائيًا بالإعدادات الحالية.</div>'
    +'<div class="card"><h3>📜 قوانين المسابقة</h3><textarea class="in" id="rulesIn" style="min-height:280px;line-height:1.9">'+esc((Q.rules||[]).join('\n'))+'</textarea>'
    +'<div class="row" style="margin-top:10px"><button class="btn primary" onclick="Q.rules=el(\'rulesIn\').value.split(\'\\n\').map(x=>x.trim()).filter(Boolean);save();toast(\'حُفظت القوانين.\')">حفظ</button>'
    +'<button class="btn gold" onclick="Q.rules=el(\'rulesIn\').value.split(\'\\n\').map(x=>x.trim()).filter(Boolean);save();show({s:\'rules\',p:0})">📺 عرض القوانين على الشاشة</button>'
    +'<button class="btn sm" onclick="rulesPage(1)">الصفحة التالية ◂</button><button class="btn sm" onclick="rulesPage(-1)">▸ السابقة</button>'
    +'<button class="btn sm" onclick="if(confirm(\'استرجاع القوانين الافتراضية؟\')){Q.rules=RULES0.slice();save();renderCtrl();}">الافتراضية</button></div></div>'
    +'<div class="card"><h3>🛟 وسائل المساعدة</h3><div class="grid2">'
    +'<div><div class="tip">عدد الوسائل المسموحة لكل فريق</div><input class="in" type="number" min="0" max="6" value="'+Q.llMax+'" onchange="Q.llMax=Math.max(0,+this.value||0);save();renderCtrl()"></div>'
    +'<div><div class="tip">مدة الاتصال بمعلم (ثانية)</div><input class="in" type="number" min="10" max="120" value="'+Q.callSecs+'" onchange="Q.callSecs=Math.max(10,+this.value||30);save()"></div>'
    +'<div><div class="tip">مدة الاستعانة بزميل (ثانية)</div><input class="in" type="number" min="10" max="120" value="'+Q.friendSecs+'" onchange="Q.friendSecs=Math.max(10,+this.value||20);save()"></div></div>'
    +'<div class="row" style="margin-top:10px">'+LL.map(x=>'<label class="row" style="gap:6px;background:rgba(0,0,0,.2);padding:8px 12px;border-radius:10px"><input type="checkbox" '+(Q.llOn[x[0]]!==false?'checked':'')
      +' onchange="Q.llOn[\''+x[0]+'\']=this.checked;save()">'+x[1]+' '+x[2]+'</label>').join('')+'</div>'
    +'<div class="row" style="margin-top:10px"><button class="btn gold" onclick="show({s:\'lifelines\'})">📺 عرض وسائل المساعدة على الشاشة</button><button class="btn sm danger" onclick="resetLL()">إعادة الوسائل لكل الفرق</button></div></div>'
    +'<div class="card"><h3>🔥 الجولات النهائية</h3><p class="tip">عند التفعيل: الإجابة الخاطئة تخصم درجة السؤال من رصيد الفريق، ويظهر شعار الجولات النهائية على الشاشة.</p>'
    +'<button class="btn '+(Q.final?'danger':'gold')+'" onclick="toggleFinal()">'+(Q.final?'إيقاف الجولات النهائية':'🔥 تفعيل الجولات النهائية')+'</button></div>';
}
const RPP=5;
function rulesPage(d){const n=Math.max(1,Math.ceil((Q.rules||[]).length/RPP));const v=Q.view||{};const p=v.s==='rules'?(v.p||0):0;show({s:'rules',p:(p+d+n)%n});}

/* ---- screen scenes ---- */
function scRules(v){const R=(Q.rules||[]),n=Math.max(1,Math.ceil(R.length/RPP)),p=Math.min(v.p||0,n-1);
  return '<div class="rulesS"><div class="rH">📜 قوانين المسابقة'+(n>1?' <span>'+(p+1)+' / '+n+'</span>':'')+'</div>'
    +R.slice(p*RPP,p*RPP+RPP).map((r,i)=>'<div class="rR" style="animation-delay:'+(i*.12)+'s"><b>'+(p*RPP+i+1)+'</b><span>'+esc(ruleTxt(r))+'</span></div>').join('')+'</div>';}
function scLifelines(){const A=llActive();
  return '<div class="rulesS"><div class="rH">🛟 وسائل المساعدة <span>'+Q.llMax+' لكل فريق</span></div><div class="llGrid">'
    +A.map((x,i)=>'<div class="llC" style="animation-delay:'+(i*.1)+'s"><i>'+x[1]+'</i><b>'+x[2]+'</b><span>'+esc(x[3])+'</span></div>').join('')+'</div></div>';}
function llIcons(id){if(!Q.llMax)return '';const t=T(id);
  return '<span class="llIc">'+llActive().map(x=>'<i class="'+((t.ll||{})[x[0]]||(!llLeft(id)&&!(t.ll||{})[x[0]])?'u':'')+'" title="'+x[2]+'">'+x[1]+'</i>').join('')+'</span>';}

/* ---- screen effects ---- */
let llScrT=null;
function llFX(f){
  const t=f.id?T(f.id):null;
  if(f.ll==='final'){ovShow('<div class="rays"></div><div class="trophy slam">🔥</div><div class="nm slam" style="color:var(--gold)">الجولات النهائية</div><div class="to">الإجابة الخاطئة تخصم درجة السؤال</div>','',4200);SFX.win(false);return;}
  if(f.ll==='fifty'){ovShow('<div class="rays"></div><div class="llBig slam">✂️</div><div class="nm slam">حذف إجابتين</div><div class="to">'+esc(t.name)+'</div>','',1600);SFX.reveal();return;}
  if(f.ll==='swap'){ovShow('<div class="rays"></div><div class="llBig slam">🔄</div><div class="nm slam">استبدال السؤال</div><div class="to">سؤال جديد من نفس الفئة · بنصف النقاط</div>','',2500);SFX.suspense(1800);return;}
  if(f.ll==='pass'){const to=T(f.to);
    ovShow('<div class="rays"></div><div class="lbl">↪️ تحويل السؤال</div><div class="passRow slam">'+shield(f.id,'14vh')+'<span class="arr">←</span>'+shield(f.to,'18vh')+'</div>'
      +'<div class="nm slam" style="font-size:clamp(28px,9vh,130px)">'+esc(to.name)+clsTag(f.to)+'</div><div class="to">الآن يجيب على السؤال</div>','',2700);
    SFX.suspense(1200);setTimeout(()=>SFX.reveal(),1100);return;}
  if(f.ll==='call'||f.ll==='friend'){
    ovShow('<div class="rays"></div><div class="llBig pulse">'+LLD[f.ll].ic+'</div><div class="nm" style="font-size:clamp(28px,10vh,140px)">'+LLD[f.ll].nm+'</div>'
      +(f.ll==='call'&&f.teacher?'<div class="to">'+esc(f.teacher)+'</div>':'<div class="to">'+esc(t.name)+'</div>')
      +'<div class="llClk" id="llClk2">'+f.secs+'</div>','',0,'play');SFX.reveal();return;}
  if(f.ll==='vote'){ovShow('<div class="rays"></div><div class="llBig pulse">📊</div><div class="nm" style="font-size:clamp(28px,10vh,140px)">تصويت الجمهور</div><div class="to">ارفعوا أيديكم للإجابة التي تختارونها</div>','',0,'play');SFX.reveal();return;}
  if(f.ll==='voteRes'){const P=Q.play,q=P.q,tot=f.v.reduce((a,b)=>a+b,0)||1;
    ovShow('<div class="lbl">📊 تصويت الجمهور</div><div class="vBars">'+q.o.map((o,i)=>{const pc=Math.round(f.v[i]/tot*100);
      return '<div class="vB'+(i===f.top?' top':'')+((P.hide||[]).includes(i)?' dim':'')+'"><div class="vP">'+pc+'%</div><div class="vCol"><i data-h="'+pc+'"></i></div><div class="vK">'+KEYS[i]+'</div><div class="vT">'+esc(o)+'</div></div>';}).join('')+'</div>','',0,'play');
    setTimeout(()=>document.querySelectorAll('.vCol i').forEach(x=>x.style.height=x.dataset.h+'%'),80);SFX.suspense(1500);setTimeout(()=>SFX.reveal(),1500);return;}
}

</script>
