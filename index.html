/* ===================== KNOCKOUT BRACKET (المباريات) =====================
   N teams → P = largest power of two ≤ N. (N−P) playoff matches (2(N−P) teams by draw),
   the other 2P−N go straight to the round of P. Then P → P/2 → … → final.               */
function brInit(){if(!Q.br||Q.br.st.some(s=>s.k==null&&!s.po))Q.br={st:[],champ:null};if(Q.finalAt==null)Q.finalAt=4;if(Q.llPerMatch==null)Q.llPerMatch=true;}
function rName(k){return k===2?'النهائي':k===4?'نصف النهائي':k===8?'ربع النهائي':'دور الـ'+k;}
function stName(i){const st=Q.br.st[i];return st?(st.po?'التصفيات':rName(st.k)):'';}
function matchNo(si,mi){let n=0;for(let i=0;i<si;i++)n+=Q.br.st[i].m.length;return n+mi+1;}
const curM=()=>Q.mid?((Q.br.st[Q.mid.s]||{}).m||[])[Q.mid.m]:null;
function stageDone(st){return st&&st.m.length>0&&st.m.every(m=>m.w);}
/* slot → team id (or null if it waits for a playoff winner) */
function slotT(x){if(!x)return null;if(typeof x==='string'&&x.startsWith('W:')){const k=+x.slice(2);const m=(Q.br.st[0]||{m:[]}).m[k];return m&&m.w||null;}return x;}
function slotLbl(x){if(!isW(x))return '؟';return 'الفائز من التصفيات '+(+x.slice(2)+1);}
const isW=x=>typeof x==='string'&&x.startsWith('W:');
function plan(n){let P=1;while(P*2<=n)P*=2;return {P,po:n-P,direct:2*P-n};}

/* ---------- the draw ---------- */
let BRBUSY=false,DSTEP=null;
const SPEEDS=[[0.6,'سريع'],[1,'عادي'],[1.6,'بطيء'],[2.3,'بطيء جدًا']];
function dsp(){return Q.drawSpeed||1.6;}
/* wait between draw steps: timed by speed, or until «التالي» in manual mode */
function dWait(ms){return new Promise(res=>{
  const t=setTimeout(()=>{if(!Q.drawManual){DSTEP=null;renderCtrl();res();}},ms*dsp());
  DSTEP={go:()=>{clearTimeout(t);DSTEP=null;renderCtrl();res();},min:Date.now()+ms*dsp()};
  if(Q.drawManual)renderCtrl();
  const chk=setInterval(()=>{if(!DSTEP){clearInterval(chk);return;}if(!Q.drawManual&&Date.now()>=DSTEP.min){clearInterval(chk);const g=DSTEP.go;g();}},250);
});}
function drawNext(){if(DSTEP)DSTEP.go();}
function drawPanel(){
  return '<div class="card" style="border-color:var(--gold)"><h3>🎲 التحكم في عرض القرعة</h3><div class="row">'
    +SPEEDS.map(s=>'<button class="btn sm'+(dsp()===s[0]?' gold':'')+'" onclick="Q.drawSpeed='+s[0]+';save();renderCtrl()">'+s[1]+'</button>').join('')
    +'<label class="row tip" style="margin-inline-start:10px"><input type="checkbox" '+(Q.drawManual?'checked':'')+' onchange="Q.drawManual=this.checked;save();renderCtrl()"> يدوي — أضغط «التالي» لكل خطوة</label></div>'
    +(BRBUSY?'<div class="row" style="margin-top:10px"><button class="btn gold lg" onclick="drawNext()"'+(DSTEP?'':' disabled')+'>التالي ◂</button>'
      +'<span class="tip">'+(Q.drawManual?(DSTEP?'بانتظارك…':'جارٍ العرض…'):'تلقائي — تقدر تضغط «التالي» للتخطي')+'</span></div>':'')+'</div>';}
async function drawMatches(fast){
  brInit();const ids=Q.teams.map(t=>t.id),n=ids.length;
  if(n<3){toast('أضف الفرق أولًا.');return;}
  if(BRBUSY)return;
  if(Q.br.st.length&&!confirm('إعادة القرعة من البداية؟ تُمسح نتائج المباريات.'))return;
  const {P,po}=plan(n),sp=dsp();
  BRBUSY=true;Q.br={st:[],champ:null};Q.mid=null;
  const poSt=po?{po:true,k:2*po,m:[]}:null,r1={k:P,m:Array.from({length:P/2},()=>({a:null,b:null,sa:0,sb:0,w:null}))};
  if(poSt)Q.br.st.push(poSt);Q.br.st.push(r1);save();renderCtrl();show({s:'bracket'});
  const nDirect=n-2*po,pos=shuffle(Array.from({length:P},(_,k)=>k));
  const setSlot=(p,v)=>{const m=r1.m[Math.floor(p/2)];if(p%2)m.b=v;else m.a=v;};
  if(!fast){fx({k:'title',t:'قرعة '+(Q.name||'البطولة'),s:n+' فريقًا · نبدأ بالـ'+nDirect+' فريقًا المتأهلين مباشرة إلى '+rName(P),dur:4000*sp});await dWait(4400);}
  // 1) direct qualifiers, one by one, placed into the tree
  let pool=shuffle(ids);
  for(let k=0;k<nDirect;k++){
    const a=pool[Math.floor(Math.random()*pool.length)];
    if(!fast){fx({k:'roulette',ids:pool,win:a,title:'المتأهل المباشر '+(k+1)+' من '+nDirect,sub:'يتأهل مباشرة إلى '+rName(P)+' · المباراة '+matchNo(po?1:0,Math.floor(pos[k]/2)),ms:2800*sp,hold:1800*sp});await dWait(5000);}
    pool=pool.filter(x=>x!==a);setSlot(pos[k],a);save();
    show({s:'bracket',hl:a});if(!fast)await dWait(1200);
  }
  // 2) the rest go to the playoffs
  if(po){
    if(!fast){fx({k:'title',t:'التصفيات',s:pool.length+' فرق تتنافس على '+po+' مقاعد في '+rName(P),dur:3600*sp});await dWait(4000);}
    for(let k=0;k<po;k++){
      const a=pool[Math.floor(Math.random()*pool.length)];pool=pool.filter(x=>x!==a);
      const b=pool.length===1?pool[0]:pool[Math.floor(Math.random()*pool.length)];
      if(!fast&&pool.length>1){fx({k:'roulette',ids:pool,win:b,title:'التصفيات · المباراة '+(k+1),sub:'يواجه '+T(a).name,ms:2600*sp,hold:1600*sp});await dWait(4700);}
      pool=pool.filter(x=>x!==b);
      poSt.m.push({a,b,sa:0,sb:0,w:null});setSlot(pos[nDirect+k],'W:'+k);save();
      if(!fast){fx({k:'mdraw',a,b,title:'التصفيات · المباراة '+(k+1)+' — الفائز إلى '+rName(P)+' · المباراة '+matchNo(1,Math.floor(pos[nDirect+k]/2)),dur:3600*sp});await dWait(4000);}
      show({s:'bracket',hl:b});if(!fast)await dWait(900);
    }
  }
  BRBUSY=false;DSTEP=null;save();renderCtrl();show({s:'bracket'});
  if(!fast)fx({k:'title',t:'اكتملت القرعة',s:Q.br.st.reduce((a,s)=>a+s.m.length,0)+' مباراة حتى الآن · بالتوفيق للجميع',dur:4000*sp});
  toast('اكتملت القرعة.',5000);
}
/* ---------- next round: winners paired in tree order ---------- */
async function nextStage(fast){
  brInit();const S=Q.br.st,st=S[S.length-1];
  if(!stageDone(st)){toast('باقي مباريات ما انتهت في '+stName(S.length-1)+'.');return;}
  const w=st.m.map(m=>m.w);
  if(w.length===1){Q.br.champ=w[0];save();crown2(w[0]);return;}
  const ns={k:w.length,m:[]};S.push(ns);BRBUSY=true;save();show({s:'bracket'});renderCtrl();
  if(!fast){fx({k:'title',t:rName(w.length),s:w.length+' فرق — كل فريق يواجه اللي قدامه في الشجرة',dur:3600*dsp()});await dWait(4000);}
  for(let j=0;j+1<w.length;j+=2){ns.m.push({a:w[j],b:w[j+1],sa:0,sb:0,w:null});save();
    if(!fast){fx({k:'mdraw',a:w[j],b:w[j+1],title:rName(w.length)+' · المباراة '+matchNo(S.length-1,ns.m.length-1),dur:3600*dsp()});await dWait(4000);}
    show({s:'bracket'});}
  BRBUSY=false;DSTEP=null;save();renderCtrl();show({s:'bracket'});
}
/* ---------- matches ---------- */
function startMatch(si,mi){brInit();const m=Q.br.st[si].m[mi];if(!m||m.w)return;
  const a=slotT(m.a),b=slotT(m.b);if(!a||!b){toast('هذه المباراة تنتظر نتيجة التصفيات.');return;}
  if(Q.mid&&curM()&&!curM().w&&!(Q.mid.s===si&&Q.mid.m===mi)&&!confirm('فيه مباراة شغّالة — تبدأ هذه بدلها؟'))return;
  m.a=a;m.b=b;stopClock();Q.mid={s:si,m:mi};m.sa=m.sa||0;m.sb=m.sb||0;
  if(Q.llPerMatch){T(a).ll={};T(b).ll={};}
  const k=Q.br.st[si].po?99:Q.br.st[si].k;Q.final=Q.finalAt>0&&k<=Q.finalAt;
  const first=Math.random()<.5?a:b,second=first===a?b:a,per=Q.perTeam||3;
  Q.order=[];for(let r=1;r<=per;r++)Q.order.push({tid:first,n:r},{tid:second,n:r});Q.turn=0;
  Q.play={tid:'',q:null,phase:'idle'};save();
  show({s:'match'});fx({k:'vs',a,b,first,title:stName(si)+' · المباراة '+matchNo(si,mi),fin:Q.final});
  TAB='play';renderCtrl();
}
function addTieBreak(){const m=curM();if(!m)return;const n=(Q.order.filter(o=>o.tid===m.a).length)+1;
  Q.order.push({tid:m.a,n,tb:1},{tid:m.b,n,tb:1});save();renderCtrl();
  fx({k:'reveal',id:m.a,label:'⚖️ سؤال حسم',to:'سؤال لكل فريق — الأعلى يتأهل',ms:2600});toast('أُضيف سؤال حسم لكل فريق.');}
function nextName(si){const st=Q.br.st[si];if(st.po){const r=Q.br.st[si+1];return r?rName(r.k):'الدور التالي';}return st.k===2?'':rName(st.k/2);}
function endMatch(w,why){const m=curM();if(!m)return;
  if(!w){if((m.sa||0)===(m.sb||0)){toast('تعادل '+(m.sa||0)+' : '+(m.sb||0)+' — أضف «سؤال حسم» أو حدّد الفائز يدويًا.',7000);return;}w=m.sa>m.sb?m.a:m.b;}
  stopClock();const si=Q.mid.s;m.w=w;m.why=why||'';Q.mid=null;Q.final=false;Q.play={tid:'',q:null,phase:'idle'};Q.order=[];save();
  const st=Q.br.st[si];
  if(!st.po&&st.k===2){Q.br.champ=w;save();renderCtrl();crown2(w);return;}
  fx({k:'qual',id:w,to:'يتأهل إلى '+nextName(si),why:why||''});
  setTimeout(()=>show({s:'bracket',hl:w}),5200);renderCtrl();
  if(stageDone(st)&&si===Q.br.st.length-1)toast('اكتمل '+stName(si)+' ✓ — من تبويب «المباريات» اضغط «تجهيز '+nextName(si)+'».',8000);
}
function crown2(id){show({s:'champion',id});setTimeout(()=>fx({k:'champion',id}),300);renderCtrl();}
function manualWin(si,mi){const m=Q.br.st[si].m[mi],a=slotT(m.a),b=slotT(m.b);if(!a||!b){toast('تنتظر نتيجة التصفيات.');return;}
  modal('<h3>تحديد الفائز يدويًا</h3><p class="tip">مثلًا عند غياب فريق (يُعدّ خاسرًا) أو قرار لجنة التحكيم.</p>'
    +'<div class="row">'+[a,b].map(id=>'<button class="btn gold" onclick="closeModal();const mm=Q.br.st['+si+'].m['+mi+'];mm.a=\''+a+'\';mm.b=\''+b+'\';Q.mid={s:'+si+',m:'+mi+'};endMatch(\''+id+'\',el(\'mwWhy\').value)">'+nmc(id)+' يتأهل</button>').join('')+'</div>'
    +'<div class="tip" style="margin-top:10px">السبب (اختياري)</div><select class="in" id="mwWhy"><option value="">—</option><option>غياب الفريق المنافس</option><option>قرار لجنة التحكيم</option><option>انسحاب</option></select>'
    +'<div class="row" style="margin-top:12px"><button class="btn" onclick="closeModal()">إلغاء</button></div>');}
function undoWin(si,mi){const st=Q.br.st[si],m=st.m[mi];
  if(st.po){const used=(Q.br.st[1]||{m:[]}).m.some(x=>(x.a===m.w||x.b===m.w)&&(x.w||(Q.mid&&Q.mid.s===1)));
    if(used){toast('الفائز لعب في الدور التالي — ألغِ مباراته هناك أولًا.',6000);return;}
    (Q.br.st[1]||{m:[]}).m.forEach(x=>{if(x.a===m.w)x.a='W:'+mi;if(x.b===m.w)x.b='W:'+mi;});}
  else if(Q.br.st.length>si+1){toast('بدأ الدور التالي — احذفه أولًا («إلغاء آخر دور»).',6000);return;}
  if(!confirm('إلغاء نتيجة هذه المباراة؟'))return;m.w=null;Q.br.champ=null;save();renderCtrl();sync();}
function dropLastStage(){const S=Q.br.st;const minLen=S[0]&&S[0].po?2:1;if(S.length<=minLen)return;
  if(!confirm('حذف آخر دور ('+stName(S.length-1)+') وإعادة تجهيزه؟'))return;S.pop();Q.br.champ=null;Q.mid=null;save();renderCtrl();show({s:'bracket'});}
/* clear every match result but keep the draw (for after test runs) */
function brResetResults(){brInit();const S=Q.br.st;if(!S.length)return;
  const first=S.findIndex(s=>!s.po);if(first<0)return;
  const po=S[0]&&S[0].po?S[0]:null;
  // a playoff team seen in the first knockout round got there through its «W:k» seat → put the seat back
  if(po)S[first].m.forEach(m=>['a','b'].forEach(k=>{const v=m[k];if(!v||isW(v))return;
    const pi=po.m.findIndex(x=>x.a===v||x.b===v);if(pi>=0)m[k]='W:'+pi;delete m[k+'0'];}));
  Q.br.st=S.slice(0,first+1);
  Q.br.st.forEach(st=>st.m.forEach(m=>{m.sa=0;m.sb=0;m.w=null;m.why='';}));
  Q.br.champ=null;}
function brScore(tid,pts){const m=curM();if(!m||!pts)return;if(tid===m.a)m.sa=(m.sa||0)+pts;else if(tid===m.b)m.sb=(m.sb||0)+pts;}

/* ---------- control tab ---------- */
function slotC(x,sz){if(!x)return '<span class="tip">؟</span>';const id=slotT(x);return id?shield(id,sz||'24px')+nmc(id):'<span class="tip">⏳ '+slotLbl(x)+'</span>';}
function tabMatches(){brInit();const S=Q.br.st,m0=curM(),n=Q.teams.length,pl=plan(n);
  let h='<h2>المباريات — خروج المغلوب</h2><div class="sub">كل مباراة بين فريقين، كل فريق '+(Q.perTeam||3)+' أسئلة بالتناوب، والأعلى نقاطًا يتأهل. عند التعادل «سؤال حسم».</div>';
  h+=drawPanel();
  if(!S.length){h+='<div class="card"><h3>نظام البطولة لـ'+n+' فريقًا</h3>'
      +(pl.po?'<p class="tip" style="font-size:14px;line-height:2">🎲 القرعة تختار <b>'+(2*pl.po)+' فرق</b> للتصفيات ('+pl.po+' مباريات)، و<b>'+pl.direct+' فريقًا</b> تتأهل مباشرة إلى '+rName(pl.P)+'.<br>'
        +'الفائزون في التصفيات يكمّلون '+rName(pl.P)+' = '+pl.P+' فريقًا، ثم ربع النهائي ← نصف النهائي ← النهائي.</p>':'<p class="tip">'+rName(pl.P)+' ← … ← النهائي.</p>')
      +'<p class="tip">مجموع المباريات: <b>'+(n-1)+'</b> — مباراة في اليوم.</p>'
      +'<div class="row" style="margin-top:8px"><button class="btn gold lg" onclick="drawMatches()"'+(BRBUSY?' disabled':'')+'>🎲 القرعة الحماسية على الشاشة</button><button class="btn sm" onclick="drawMatches(true)">قرعة سريعة بدون عرض</button></div></div>';
    return h;}
  const last=S[S.length-1];
  h+='<div class="card"><div class="row"><button class="btn gold" onclick="show({s:\'bracket\'})">📺 عرض شجرة البطولة</button>'
    +(m0?'<button class="btn primary" onclick="TAB=\'play\';renderCtrl()">⚔ المباراة الجارية</button>':'')
    +(stageDone(last)&&!Q.br.champ&&!last.po?'<button class="btn gold" onclick="nextStage()"'+(BRBUSY?' disabled':'')+'>➡ تجهيز '+esc(last.k===2?'التتويج':rName(last.k/2))+'</button><button class="btn sm" onclick="nextStage(true)">بدون عرض</button>':'')
    +(S.length>(S[0].po?2:1)?'<button class="btn sm" onclick="dropLastStage()">إلغاء آخر دور</button>':'')
    +'<button class="btn sm danger" onclick="resetScores()">🧹 تصفير النتائج (بعد التجارب)</button><button class="btn sm danger" onclick="drawMatches()">إعادة القرعة</button></div>'
    +'<div class="row" style="margin-top:10px"><label class="row tip"><input type="checkbox" '+(Q.llPerMatch?'checked':'')+' onchange="Q.llPerMatch=this.checked;save()"> تتجدد وسائل المساعدة في كل مباراة</label>'
    +'<label class="row tip">🔥 خصم الإجابة الخاطئة من: <select class="in" style="width:auto;padding:5px 8px" onchange="Q.finalAt=+this.value;save()">'
    +[[16,'دور الـ16'],[8,'ربع النهائي'],[4,'نصف النهائي'],[2,'النهائي فقط'],[0,'بدون خصم']].map(o=>'<option value="'+o[0]+'"'+(Q.finalAt===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label></div></div>';
  S.forEach((st,si)=>{
    h+='<div class="card"><h3>'+esc(stName(si))+' <span class="tip">'+st.m.filter(m=>m.w).length+' / '+st.m.length+'</span></h3>';
    st.m.forEach((m,mi)=>{const live=Q.mid&&Q.mid.s===si&&Q.mid.m===mi,ready=slotT(m.a)&&slotT(m.b);
      h+='<div class="mRow'+(live?' live':'')+(m.w?' done':'')+'"><span class="mNo">'+matchNo(si,mi)+'</span>'
        +'<span class="mT'+(m.w&&m.w===slotT(m.a)?' w':m.w?' l':'')+'">'+slotC(m.a)+'</span><b class="mS">'+(m.sa||0)+' : '+(m.sb||0)+'</b>'
        +'<span class="mT'+(m.w&&m.w===slotT(m.b)?' w':m.w?' l':'')+'">'+slotC(m.b)+'</span>'
        +'<span class="row" style="gap:4px;margin-inline-start:auto">'
        +(m.w?(m.why?'<span class="tip">'+esc(m.why)+'</span>':'')+'<button class="btn sm" onclick="undoWin('+si+','+mi+')">↺</button>'
          :(live?'<span class="tip" style="color:var(--gold)">● جارية</span>':(ready?'<button class="btn sm primary" onclick="startMatch('+si+','+mi+')">▶ ابدأ</button>':'<span class="tip">'+(!m.a||!m.b?'بانتظار القرعة':'بانتظار التصفيات')+'</span>'))
           +(ready?'<button class="btn sm" onclick="manualWin('+si+','+mi+')">تحديد الفائز</button>':''))+'</span></div>';});
    h+='</div>';});
  if(Q.br.champ)h+='<div class="card" style="text-align:center"><h3 style="justify-content:center">🏆 البطل: '+nmc(Q.br.champ)+'</h3><button class="btn gold" onclick="crown2(Q.br.champ)">إعادة التتويج على الشاشة</button></div>';
  return h;}
function matchCard(){const m=curM();if(!m)return '';const si=Q.mid.s,mi=Q.mid.m,left=Q.order.length-Q.turn;
  return '<div class="card" style="border-color:var(--gold)"><div class="row" style="justify-content:space-between"><b>⚔ '+esc(stName(si))+' · المباراة '+matchNo(si,mi)+(Q.final?' · 🔥 خصم عند الخطأ':'')+'</b>'
    +'<span class="tip">متبقٍ '+Math.max(0,left)+' دور</span></div>'
    +'<div class="vsCtl"><span>'+shield(m.a,'30px')+nmc(m.a)+'</span><b>'+(m.sa||0)+' : '+(m.sb||0)+'</b><span>'+nmc(m.b)+shield(m.b,'30px')+'</span></div>'
    +'<div class="row"><button class="btn sm" onclick="show({s:\'match\'})">📺 لوحة النتيجة</button><button class="btn sm" onclick="addTieBreak()">⚖️ سؤال حسم</button>'
    +'<button class="btn sm gold" onclick="endMatch()">🏁 إنهاء وإعلان الفائز</button><button class="btn sm" onclick="manualWin('+si+','+mi+')">تحديد الفائز يدويًا</button></div></div>';}

/* ---------- screen scenes ---------- */
function scMatch(){const m=curM();if(!m)return scBracket({});
  const si=Q.mid.s,lead=m.sa===m.sb?'':(m.sa>m.sb?m.a:m.b);
  const side=(id,sc)=>'<div class="vsSide'+(lead===id?' lead':'')+'">'+shield(id,'22vh')+'<div class="vsN">'+nm(id)+clsTag(id)+'</div><div class="vsSc">'+sc+'</div></div>';
  return '<div class="vsWrap"><div class="vsT">'+esc(stName(si))+' · المباراة '+matchNo(si,Q.mid.m)+(Q.final?' · <span style="color:#FF9DA0">🔥 خصم عند الخطأ</span>':'')+'</div>'
    +'<div class="vsRow">'+side(m.a,m.sa||0)+'<div class="vsX">VS</div>'+side(m.b,m.sb||0)+'</div></div>';}
function scBracket(v){brInit();const S=Q.br.st;
  if(!S.length)return '<div class="idle"><div class="st">شجرة البطولة — بانتظار القرعة</div></div>';
  const row=(x,m,sc,live)=>{const id=slotT(x);
    if(!id)return '<div class="bT wait"><span class="q">؟</span><span>'+(isW(x)?'فائز التصفيات '+(+x.slice(2)+1):'')+'</span></div>';
    const won=m.w&&m.w===id,lost=m.w&&m.w!==id;
    return '<div class="bT'+(won?' w':'')+(lost?' l':'')+(v.hl===id?' hl':'')+'">'+shield(id,'3.2vh')+'<span>'+sh(id)+'</span><b>'+(m.w||live||(m.sa||m.sb)?sc:'')+'</b></div>';};
  const card=(m,si,mi)=>{const live=Q.mid&&Q.mid.s===si&&Q.mid.m===mi;
    return '<div class="bM'+(live?' live':'')+'"><i class="bNo">'+matchNo(si,mi)+'</i>'+row(m.a,m,m.sa||0,live)+row(m.b,m,m.sb||0,live)+'</div>';};
  const cols=S.map((st,si)=>'<div class="bCol'+(st.po?' po':'')+'"><div class="bH">'+esc(stName(si))+'</div><div class="bList">'+st.m.map((m,mi)=>card(m,si,mi)).join('')+'</div></div>');
  let k=S[S.length-1].po?0:S[S.length-1].k/2;
  while(k>=2){cols.push('<div class="bCol"><div class="bH">'+rName(k)+'</div><div class="bList">'+Array.from({length:k/2},()=>'<div class="bM empty"><div class="bT">؟</div><div class="bT">؟</div></div>').join('')+'</div></div>');k/=2;}
  cols.push('<div class="bCol champ"><div class="bH">البطل</div><div class="bList"><div class="bM champ">'+(Q.br.champ?shield(Q.br.champ,'7vh')+'<span>'+sh(Q.br.champ)+'</span>':'🏆')+'</div></div></div>');
  return '<div class="bWrap">'+cols.join('')+'</div>';}

/* ---------- screen effects ---------- */
function bigSide(x,cls){const id=slotT(x);
  return '<div class="vsSide '+cls+'">'+(id?shield(id,'20vh')+'<div class="vsN">'+nm(id)+clsTag(id)+'</div>'
    :'<div class="qShield">؟</div><div class="vsN" style="font-size:clamp(16px,4.4vh,60px)">'+slotLbl(x)+'</div>')+'</div>';}
function brFX(f){
  if(f.k==='title'){ovShow('<div class="rays"></div><div class="trophy slam">🎲</div><div class="nm slam" style="color:var(--gold);font-size:clamp(28px,10vh,140px)">'+esc(f.t)+'</div><div class="to">'+esc(f.s||'')+'</div>','',3400);
    SFX.suspense(1500);setTimeout(()=>SFX.reveal(),1400);return true;}
  if(f.k==='mdraw'||f.k==='vs'){
    ovShow('<div class="rays"></div><div class="lbl">'+esc(f.title||'')+'</div><div class="vsRow fx">'+bigSide(f.a,'s1')
      +'<div class="vsX s3">VS</div>'+bigSide(f.b,'s2')+'</div>'
      +(f.k==='vs'?'<div class="to s4">🎲 يبدأ: '+nm(f.first)+(f.fin?' · 🔥 خصم عند الخطأ':'')+'</div>':''),'',f.k==='vs'?5200:(f.dur||3100));
    SFX.reveal();setTimeout(()=>SFX.reveal(),700);setTimeout(()=>{SFX.suspense(900);},1100);if(f.k==='vs')setTimeout(()=>SFX.start(),2600);
    return true;}
  if(f.k==='qual'){const t=T(f.id);
    ovShow('<div class="rays"></div><div class="lbl">'+(f.why?esc(f.why):'🏁 نهاية المباراة')+'</div><div class="slam">'+shield(f.id,'22vh')+'</div>'
      +'<div class="nm slam" style="color:var(--gold)">'+esc(t.name)+clsTag(f.id)+'</div><div class="to">'+esc(f.to)+'</div>','',5000);
    SFX.win(false);confetti(5000);return true;}
  return false;}

</script>
